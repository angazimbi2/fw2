<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  ::selection { background: #2454E0; color: #fff; }
  :root {
    --bg-top: #F6F8FC; --bg-mid: #EEF1F8; --ink: #10192B; --card-from: #FFFFFF; --card-to: #FCFDFF;
    --card-border: #E4E9F4; --field-bg: #F5F7FB; --field-border: #E4E9F4; --line: #EEF1F8;
    --nav-bg: rgba(255,255,255,0.86); --nav-border: #E4E9F4; --scrollbar: #C7D0E0; --glow: rgba(36,84,224,0.16);
  }
  html[data-theme="dark"] {
    --bg-top: #0E1420; --bg-mid: #0B0F19; --ink: #EAF0FB; --card-from: #18202E; --card-to: #151C29;
    --card-border: #2A3547; --field-bg: #1D2636; --field-border: #2A3547; --line: #232E42;
    --nav-bg: rgba(20,27,40,0.88); --nav-border: #2A3547; --scrollbar: #3A4761; --glow: rgba(36,84,224,0.22);
  }
  body {
    font-family: -apple-system, "Inter", "SF Pro Display", Roboto, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
    background:
      radial-gradient(1100px 480px at 50% -180px, var(--glow), rgba(36,84,224,0) 60%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 320px, var(--bg-mid) 100%);
    background-attachment: fixed;
    letter-spacing: -0.005em;
    transition: background-color .2s ease, color .2s ease;
  }
  button { cursor: pointer; font-family: inherit; }
  input, select { font-family: inherit; }
  input:focus, button:focus-visible, select:focus { outline: 2px solid #2454E0; outline-offset: 2px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 8px 10px; font-size: 12.5px; white-space: nowrap; }
  thead th { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: #64748B; font-weight: 700; padding-bottom: 10px; }
  tbody tr { transition: background .12s ease; }
  tbody tr:nth-child(even) { background: rgba(36,84,224,0.025); }
  tbody tr:hover { background: rgba(36,84,224,0.05); }
  tbody td { border-bottom: 1px solid var(--line); }
  .serif { font-family: 'Georgia', 'Iowan Old Style', 'Times New Roman', serif; }
  .mono { font-family: 'SFMono-Regular', 'SF Mono', Consolas, Menlo, monospace; font-variant-numeric: tabular-nums; }
  #app { min-height: 100vh; display: flex; flex-direction: column; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 22px 16px 110px; flex: 1; width: 100%; }

  .card {
    background: linear-gradient(180deg, var(--card-from) 0%, var(--card-to) 100%);
    border-radius: 18px; border: 1px solid var(--card-border); padding: 17px;
    box-shadow: 0 1px 2px rgba(16,25,43,0.03), 0 10px 24px -12px rgba(16,25,43,0.10);
    transition: box-shadow .2s ease, transform .15s ease, border-color .2s ease, background .2s ease;
    position: relative;
  }
  .card:active { transform: scale(0.994); box-shadow: 0 1px 2px rgba(16,25,43,0.04), 0 4px 10px -4px rgba(16,25,43,0.08); }

  .label { font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase; color: #64748B; font-weight: 700; margin-bottom: 6px; display: block; }

  .field {
    width: 100%; padding: 11px 13px; border-radius: 11px; border: 1.5px solid var(--field-border);
    background: var(--field-bg); color: var(--ink); font-size: 15px;
    transition: border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .field:focus { background: var(--card-from); border-color: #2454E0; box-shadow: 0 0 0 4px rgba(36,84,224,0.10); }

  .btn-primary {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: linear-gradient(135deg, #3366F0 0%, #1E42C4 100%);
    color: #fff; border: none; border-radius: 12px; padding: 13px 16px; font-size: 15px; font-weight: 650;
    box-shadow: 0 1px 1px rgba(20,40,120,0.15), 0 8px 18px -6px rgba(30,66,196,0.45);
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    letter-spacing: -0.005em;
  }
  .btn-primary:hover { filter: brightness(1.04); }
  .btn-cash { background: linear-gradient(135deg, #14B87F 0%, #0A8F5F 100%); box-shadow: 0 1px 1px rgba(10,80,50,0.15), 0 8px 18px -6px rgba(10,143,95,0.45); }
  button:active { transform: scale(0.96); }

  .bottom-nav {
    position: sticky; bottom: 0; z-index: 20;
    background: var(--nav-bg);
    backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
    border-top: 1px solid var(--nav-border);
    box-shadow: 0 -8px 26px -14px rgba(16,25,43,0.20);
    display: flex; max-width: 560px; margin: 0 auto; width: 100%;
    padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px));
  }
  .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 2px 6px; background: none; border: none; font-size: 10px; border-radius: 12px; transition: background .15s ease; color: var(--ink); }
  .nav-icon-chip { display: flex; align-items: center; justify-content: center; width: 36px; height: 25px; border-radius: 9px; transition: background .18s ease, transform .18s ease; }
  .nav-btn:active .nav-icon-chip { transform: scale(0.88); }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .wrap > *, .wrap { animation: fadeSlideIn .28s ease both; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  .menu-btn { flex-shrink: 0; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--card-border); background: var(--card-from); display: flex; align-items: center; justify-content: center; }
  .drawer-overlay {
    position: fixed; inset: 0; background: rgba(8,12,22,0.42); backdrop-filter: blur(2px);
    z-index: 40; opacity: 0; pointer-events: none; transition: opacity .22s ease;
  }
  .drawer-overlay.open { opacity: 1; pointer-events: auto; }
  .drawer-panel {
    position: fixed; top: 0; left: 0; bottom: 0; width: min(84vw, 340px); z-index: 41;
    background: linear-gradient(180deg, var(--card-from) 0%, var(--card-to) 100%);
    border-right: 1px solid var(--card-border);
    box-shadow: 14px 0 34px -18px rgba(16,25,43,0.35);
    transform: translateX(-104%); transition: transform .26s cubic-bezier(.32,.72,0,1);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .drawer-panel.open { transform: translateX(0); }
  .drawer-head { padding: 20px 18px 14px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 10px 12px calc(20px + env(safe-area-inset-bottom, 0px)); }
  .drawer-section { border-bottom: 1px solid var(--line); }
  .drawer-section:last-child { border-bottom: none; }
  .drawer-section-btn {
    width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: none;
    padding: 13px 6px; text-align: left; color: var(--ink);
  }
  .drawer-section-icon { flex-shrink: 0; width: 32px; height: 32px; border-radius: 9px; display: flex; align-items: center; justify-content: center; }
  .drawer-section-title { flex: 1; font-weight: 650; font-size: 14px; }
  .drawer-chevron { flex-shrink: 0; transition: transform .18s ease; }
  .drawer-chevron.open { transform: rotate(90deg); }
  .drawer-section-content { overflow: hidden; padding: 0 6px; }
  .collapse-card { margin-bottom: 14px; }
  .collapse-card-btn {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: none; border: none; padding: 0; text-align: left; color: var(--ink);
  }
  .collapse-card-body { overflow: hidden; }
  .auth-gate { position: fixed; inset: 0; z-index: 9999; background: var(--bg-top); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-card { width: 100%; max-width: 340px; background: linear-gradient(180deg, var(--card-from), var(--card-to)); border: 1px solid var(--card-border); border-radius: 18px; padding: 28px 22px; box-shadow: 0 20px 40px -20px rgba(11,30,77,0.35); }
  .auth-field { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--field-border); background: var(--field-bg); color: var(--ink); font-size: 15px; margin-bottom: 12px; }
  .auth-btn { width: 100%; padding: 13px; border-radius: 10px; border: none; background: #2454E0; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
  .auth-btn:disabled { opacity: 0.6; }
  .auth-error { color: #D0342C; font-size: 12.5px; margin: -4px 0 12px; min-height: 15px; }
</style>
</head>
<body>
<div id="auth-gate" class="auth-gate">
  <div class="auth-card">
    <div style="font-weight:700;font-size:20px;margin-bottom:4px;color:var(--ink)">FW2 Tank Ledger</div>
    <div style="font-size:13px;color:var(--ink);opacity:0.65;margin-bottom:18px">Sign in to continue</div>
    <div id="auth-error" class="auth-error"></div>
    <input id="auth-email" type="email" class="auth-field" placeholder="Email" autocomplete="username" />
    <input id="auth-password" type="password" class="auth-field" placeholder="Password" autocomplete="current-password" />
    <button id="auth-submit" class="auth-btn">Sign in</button>
  </div>
</div>
<div id="app" style="display:none"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
"use strict";

// ---------- firebase ----------
// TODO: paste your actual Firebase project config here (Project settings -> General -> Your apps)
var firebaseConfig = {
  apiKey: "AIzaSyD7tXy9W7BI_eXngeeJXq3iKMeni1h3JBI",
  authDomain: "fw2-app.firebaseapp.com",
  projectId: "fw2-app",
  storageBucket: "fw2-app.firebasestorage.app",
  messagingSenderId: "1005917715286",
  appId: "1:1005917715286:web:05d41057528d528930b4f7"
};
firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.firestore();

// The whole app's data (tanks, readings, ledgers, everything in `state`) lives in ONE
// shared Firestore document, so every signed-in user (admin or salesperson) reads and
// writes the same business data — this mirrors exactly how the old localStorage blob
// worked, just moved to the cloud so it's shared instead of per-device.
var SHARED_STATE_DOC = db.collection('appState').doc('shared');

var currentUser = null; // { uid, role, name }
var saveDebounceTimer = null;
var applyingRemoteUpdate = false; // guards against the snapshot listener clobbering a local edit-in-progress

function isFormOpen(){
  return !!(ui.addingTank || ui.addingLoan || ui.addingOtherTank || ui.editingTankId || ui.editingReadingId ||
    ui.editingCollectionId || ui.editingRefillId || ui.editingOtherTankId || ui.recordingPaymentFor ||
    ui.acctFormType || ui.titheFormOpen);
}

function showAuthError(msg){
  document.getElementById('auth-error').textContent = msg || '';
}

function attemptSignIn(){
  var email = document.getElementById('auth-email').value.trim();
  var password = document.getElementById('auth-password').value;
  var btn = document.getElementById('auth-submit');
  if (!email || !password) { showAuthError('Enter your email and password.'); return; }
  showAuthError('');
  btn.disabled = true; btn.textContent = 'Signing in…';
  auth.signInWithEmailAndPassword(email, password).catch(function(err){
    btn.disabled = false; btn.textContent = 'Sign in';
    showAuthError(err && err.message ? err.message : 'Sign in failed.');
  });
}

document.getElementById('auth-submit').addEventListener('click', attemptSignIn);
document.getElementById('auth-password').addEventListener('keydown', function(e){ if (e.key === 'Enter') attemptSignIn(); });

// Loads this user's role/name from users/{uid}, then loads the shared business
// state, then boots the app exactly as it used to boot from localStorage.
function startAppForUser(user){
  db.collection('users').doc(user.uid).get().then(function(userDoc){
    var profile = userDoc.exists ? userDoc.data() : { role: 'salesperson', name: user.email };
    currentUser = { uid: user.uid, role: profile.role || 'salesperson', name: profile.name || user.email };

    SHARED_STATE_DOC.get().then(function(doc){
      if (doc.exists && doc.data() && doc.data().tanks && doc.data().tanks.length) {
        applyFirestoreData(doc.data());
      } else {
        state.tanks = seedTanks();
        persistStateNow();
      }
      document.getElementById('auth-gate').style.display = 'none';
      document.getElementById('app').style.display = '';
      applyTheme(getStoredTheme());
      render();
      listenForRemoteChanges();
    }).catch(function(err){
      showAuthError('Could not load business data: ' + err.message);
    });
  }).catch(function(err){
    showAuthError('Could not load your account: ' + err.message);
  });
}

// Same field-by-field assignment loadState() used to do from a parsed localStorage
// blob — just fed by Firestore data instead of JSON.parse(localStorage.getItem(...)).
function applyFirestoreData(data){
  state.tanks = data.tanks || []; state.readings = data.readings || []; state.loans = data.loans || [];
  state.cleanings = data.cleanings || []; state.waterTests = data.waterTests || [];
  state.accountTx = data.accountTx || []; state.cashTx = data.cashTx || []; state.titheTx = data.titheTx || [];
  state.interestIncomeTx = data.interestIncomeTx || [];
  state.otherTanks = data.otherTanks || [];
  state.collections = data.collections || []; state.refills = data.refills || [];
  stripNonUSDRecords();
  backfillInterestIncomeTx();
  var migrated = normalizeCyclesData(data);
  state.collections = migrated.collections; state.refills = migrated.refills;
}

// Writes the whole `state` object to the shared Firestore doc, debounced so a burst
// of edits (or fields firing on every keystroke) doesn't spam Firestore with writes.
function persistStateDebounced(){
  clearTimeout(saveDebounceTimer);
  saveDebounceTimer = setTimeout(persistStateNow, 500);
}
function persistStateNow(){
  SHARED_STATE_DOC.set(state).catch(function(err){ console.error('FW2 save failed:', err); });
}

// Keeps every signed-in device/user in sync in near-real-time. Skipped while the
// user has a form open, so a half-finished edit never gets overwritten mid-typing.
function listenForRemoteChanges(){
  SHARED_STATE_DOC.onSnapshot(function(doc){
    if (!doc.exists || !doc.data()) return;
    if (isFormOpen()) return; // don't clobber an in-progress edit
    applyingRemoteUpdate = true;
    applyFirestoreData(doc.data());
    render();
    applyingRemoteUpdate = false;
  });
}

auth.onAuthStateChanged(function(user){
  if (user) {
    startAppForUser(user);
  } else {
    document.getElementById('auth-gate').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    document.getElementById('auth-submit').disabled = false;
    document.getElementById('auth-submit').textContent = 'Sign in';
  }
});

// ---------- constants & helpers ----------
// Semantic colors that stay identical in both themes (status/brand colors read fine on
// light or dark surfaces). Surface/ink/line/paper are the ones that flip per theme —
// they're applied on top of THEME_BASE below via applyTheme().
var THEME_BASE = { tank:'#2454E0', tankDeep:'#0B1E4D', cage:'#A9B4C7',
  cash:'#0A9A63', amber:'#D9820A', crisis:'#DC2626',
  purple:'#7C3AED', mapRed:'#E11D48', gold:'#C9A227' };
var THEMES = {
  light: { surface:'#FFFFFF', paper:'#F5F7FB', ink:'#10192B', inkSoft:'#64748B', line:'#E4E9F4' },
  dark:  { surface:'#18202E', paper:'#212B3C', ink:'#EAF0FB', inkSoft:'#93A0B8', line:'#303D53' }
};
var C = Object.assign({}, THEME_BASE, THEMES.light);
var APP_CREATED_LABEL = 'August 2026';
var APP_VERSION = '1.3';
var THEME_KEY = 'tank-ledger-theme-v1';
function getStoredTheme(){
  try { return localStorage.getItem(THEME_KEY) === 'dark' ? 'dark' : 'light'; } catch(e) { return 'light'; }
}
function applyTheme(mode){
  Object.assign(C, THEME_BASE, THEMES[mode] || THEMES.light);
  document.documentElement.setAttribute('data-theme', mode);
  var metaTheme = document.querySelector('meta[name="theme-color"]');
  if (metaTheme) metaTheme.setAttribute('content', mode==='dark' ? '#0B0F19' : '#0B1E4D');
  try { localStorage.setItem(THEME_KEY, mode); } catch(e) {}
}
var TANK_CAPACITY = 1000, PRICE_PER_L = 1, DEFAULT_RESTOCK = 31.25, DEFAULT_SALESPAY = 12.5, COLLECTION_TARGET = 18.75;
var STORAGE_KEY = 'tank-ledger-state-v1';
var PIN_KEY = 'tank-ledger-pin-hash-v1'; // deliberately separate from STORAGE_KEY so PIN never ends up in exported backups

function hashPin(pin){
  var h = 0;
  for (var i = 0; i < pin.length; i++) { h = (h * 31 + pin.charCodeAt(i)) | 0; }
  return 'p' + h;
}
function pinIsSet(){
  try { return !!localStorage.getItem(PIN_KEY); } catch(e) { return false; }
}
function setStoredPin(pin){
  try { localStorage.setItem(PIN_KEY, hashPin(pin)); } catch(e) {}
}
function removeStoredPin(){
  try { localStorage.removeItem(PIN_KEY); } catch(e) {}
}
function verifyPin(pin){
  try { return localStorage.getItem(PIN_KEY) === hashPin(pin || ''); } catch(e) { return false; }
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.max((new Date(b) - new Date(a)) / 86400000, 0.01); }
// Most recent date any activity (a level reading or a refill) was logged for a tank.
// Falls back to the tank's lastRefillDate if it has never had a reading logged.
function lastTankActivityDate(t){
  var last = t.lastRefillDate || null;
  state.readings.forEach(function(r){
    if (r.tankId===t.id && (!last || r.date > last)) last = r.date;
  });
  state.refills.forEach(function(r){
    if (r.tankId===t.id && (!last || r.date > last)) last = r.date;
  });
  return last;
}
// Days since a tank last had any reading or refill logged. Used to flag tanks
// that haven't been visited in a while, not just ones with zero readings ever.
function daysSinceTankActivity(t){
  var last = lastTankActivityDate(t);
  if (!last) return 0;
  return daysBetween(last, todayISO());
}
function monthKey(d){ return d.slice(0,7); }
function monthLabel(mk){ return new Date(mk+'-01').toLocaleDateString(undefined,{month:'short',year:'2-digit'}); }
function rand(n){ return '$' + Math.round(n).toLocaleString(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
// Normalizes a locally-entered number (e.g. "0771234567" or "+263771234567" or
// "263 77 123 4567") into the digits-only international format wa.me needs.
// A leading 0 is treated as the Zimbabwean trunk prefix and swapped for 263.
function waDigits(raw){
  var digits = String(raw||'').replace(/[^0-9]/g, '');
  if (!digits) return '';
  if (digits.charAt(0) === '0') digits = '263' + digits.slice(1);
  return digits;
}
function waLink(raw){
  var d = waDigits(raw);
  return d ? 'https://wa.me/' + d : '';
}
// Renders an order code as a small pill. Used identically for a refill (the order that
// opened/closed the cycle) and every collection paid against that same cycle, so the two
// are visually stamped with the exact same badge — same text, same shape — wherever they
// show up in the app. That's what makes a matching pair recognizable at a glance.
function codePill(code){
  return '<span class="mono" style="display:inline-block;background:linear-gradient(180deg,'+C.paper+',#EBEFF9);border:1px solid '+C.line+';border-radius:7px;padding:2px 7px;font-size:10.5px;font-weight:700;color:'+C.tankDeep+';letter-spacing:0.01em">'+esc(code)+'</span>';
}

function seedTanks(){
  var arr = [];
  for (var i=1;i<=7;i++) arr.push({ id: uid(), name: 'Tank '+i, location:'', salesperson:'', whatsapp:'', currentLevel: TANK_CAPACITY, lastRefillDate: todayISO(), cycleSeq: 0, incomeEnabled: true, cleaningResetAtCycle: 0, waterTestResetAtCycle: 0 });
  return arr;
}

// A tank counts as an "income tank" unless explicitly switched off. Missing the field
// entirely (older data) is treated as on, so nothing changes for existing tanks until
// the owner deliberately flips the switch for one that's refill-only.
function isIncomeTank(t){ return !!t && t.incomeEnabled !== false; }
function incomeTanks(){ return state.tanks.filter(isIncomeTank); }

// ---------- state ----------
var state = { tanks: [], readings: [], collections: [], refills: [], loans: [], cleanings: [], waterTests: [], accountTx: [], cashTx: [], titheTx: [], interestIncomeTx: [], otherTanks: [] };
var ui = { tab: 'overview', editingTankId: null, editingReadingId: null, editingCollectionId: null, editingRefillId: null, logMode: 'reading', logTankId: null, logPresetCycle: null, msg: '', addingTank: false, addingLoan: false, loanCurrency: 'USD', recordingPaymentFor: null, confirmDialog: null, unlockedTabs: {}, pinPrompt: null, lockError: '', collectionsExpanded: {}, refillsExpanded: {}, acctFormType: null, acctCurrency: 'USD', acctTransferDir: 'to-cash', acctHistoryCurrency: 'USD', titheFormOpen: false, titheCurrency: 'USD', titheMsg: '', drawerOpen: false, drawerSection: null, acctDashExpanded: {}, acctHistExpanded: {}, titheHistExpanded: false, acctHistCardExpanded: {}, acctSectionOpen: {}, addingOtherTank: false, otherTankMsg: '', pendingOtherTankLatLng: null, editingOtherTankId: null };
var pendingRestoreData = null;

// Old backups/state stored a single "cycles" array where collecting the owner's
// cut and refilling the tank always happened together. Split each legacy cycle
// into a refill record and a collection record (same date, same amounts) so
// history and income graphs carry over unchanged.
//
// Every refill/collection is also tagged with a "cycle" number (how many refills
// that tank had already had when it was recorded), and every tank carries a
// cycleSeq for its current open cycle. This is what the "collected" badge checks,
// instead of comparing dates — so a same-day refill-then-collect (or collect-then-refill)
// can never be confused with the previous cycle.
function normalizeCyclesData(data){
  var collections = Array.isArray(data.collections) ? data.collections.slice() : [];
  var refills = Array.isArray(data.refills) ? data.refills.slice() : [];

  if (Array.isArray(data.cycles) && data.cycles.length && !data.refills && !data.collections) {
    data.cycles.slice().sort(function(a,b){ return new Date(a.date)-new Date(b.date); }).forEach(function(c){
      refills.push({ id: c.id+'-r', tankId: c.tankId, date: c.date, litresSold: c.litresSold, salesPay: c.salesPay, restock: c.restock });
      collections.push({ id: c.id+'-c', tankId: c.tankId, date: c.date, amount: c.ownerCollected });
    });
  }

  var tanks = data.tanks || [];
  var refillsByTank = {}, collectionsByTank = {};
  refills.forEach(function(r){ (refillsByTank[r.tankId] = refillsByTank[r.tankId] || []).push(r); });
  collections.forEach(function(c){ (collectionsByTank[c.tankId] = collectionsByTank[c.tankId] || []).push(c); });

  tanks.forEach(function(t){
    var tRefills = (refillsByTank[t.id] || []).slice().sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
    var tCollections = collectionsByTank[t.id] || [];
    tRefills.forEach(function(r, i){ if (r.cycle === undefined) r.cycle = i; });
    tCollections.forEach(function(c){
      if (c.cycle !== undefined) return;
      var n = 0;
      tRefills.forEach(function(r){ if (new Date(r.date) <= new Date(c.date)) n++; });
      c.cycle = n;
    });
    if (t.cycleSeq === undefined) t.cycleSeq = tRefills.length;
    // Older tanks predate the maintenance module entirely — treat them as freshly
    // cleaned/tested as of now rather than assuming years of unaddressed cycles.
    if (t.cleaningResetAtCycle === undefined) t.cleaningResetAtCycle = t.cycleSeq;
    if (t.waterTestResetAtCycle === undefined) t.waterTestResetAtCycle = t.cycleSeq;
  });

  return { collections: collections, refills: refills };
}
// One-time migration: the business now operates in USD only. Strips any lingering
// ZAR-denominated records from every ledger so nothing Rand-related shows up in
// dashboards, history, or totals going forward.
function stripNonUSDRecords(){
  state.accountTx = state.accountTx.filter(function(t){ return (t.currency||'USD')==='USD'; });
  state.cashTx = state.cashTx.filter(function(t){ return (t.currency||'USD')==='USD'; });
  state.loans = state.loans.filter(function(l){ return (l.currency||'USD')==='USD'; });
  state.titheTx = state.titheTx.filter(function(t){ return (t.currency||'USD')==='USD'; });
  state.interestIncomeTx = state.interestIncomeTx.filter(function(t){ return (t.currency||'USD')==='USD'; });
}
function loadState(){
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    var data = JSON.parse(raw);
    if (data && data.tanks && data.tanks.length) {
      state.tanks = data.tanks; state.readings = data.readings || []; state.loans = data.loans || [];
      state.cleanings = data.cleanings || []; state.waterTests = data.waterTests || [];
      state.accountTx = data.accountTx || []; state.cashTx = data.cashTx || []; state.titheTx = data.titheTx || [];
      state.interestIncomeTx = data.interestIncomeTx || [];
      state.otherTanks = data.otherTanks || [];
      stripNonUSDRecords();
      backfillInterestIncomeTx();
      var migrated = normalizeCyclesData(data);
      state.collections = migrated.collections; state.refills = migrated.refills;
      return true;
    }
  } catch(e) {}
  return false;
}
// One-time migration for data recorded before the interest-income ledger existed.
// Every loan-interest tithe entry carries meta.loanId, so the original interest
// delta can be reconstructed exactly as tithe-amount / TITHE_RATE — this works even
// for loans since deleted, since it's derived purely from tithe history, not from
// the loan records themselves.
function backfillInterestIncomeTx(){
  if (state.interestIncomeTx.length) return;
  var loanTithes = state.titheTx.filter(function(t){ return t.meta && t.meta.loanId; });
  if (!loanTithes.length) return;
  state.interestIncomeTx = loanTithes.map(function(t){
    return { id: uid(), date: t.date, type: t.amount>0?'accrual':'reversal', currency: t.currency,
      amount: t.amount / TITHE_RATE, description: t.description.replace(/^Tithe/, 'Interest income'), meta: t.meta };
  });
  saveState();
}
function saveState(){
  if (applyingRemoteUpdate) return; // this save was triggered by data we just received, not a local edit
  persistStateDebounced();
}
function performFullReset(){

}

function addReading(tankId, date, level){

  state.readings = state.readings.concat([entry]).sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
  var mine = state.readings.filter(function(r){ return r.tankId===tankId; });
  var latest = mine[mine.length-1];
  if (latest) state.tanks = state.tanks.map(function(t){ return t.id===tankId ? Object.assign({},t,{currentLevel:latest.level}) : t; });
  saveState();
}
// Correct a previously logged reading (wrong date or level typed in). Recalculates the
// tank's current level afterward the same way addReading does, in case this was the latest one.
function editReading(id, date, level){
  var tankId;
  state.readings = state.readings.map(function(r){
    if (r.id!==id) return r;
    tankId = r.tankId;
    return Object.assign({}, r, { date: date, level: level });
  }).sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
  if (tankId) {
    var mine = state.readings.filter(function(r){ return r.tankId===tankId; });
    var latest = mine[mine.length-1];
    if (latest) state.tanks = state.tanks.map(function(t){ return t.id===tankId ? Object.assign({},t,{currentLevel:latest.level}) : t; });
  }
  saveState();
}
function deleteReading(id){ state.readings = state.readings.filter(function(r){ return r.id!==id; }); saveState(); }
// Refilling: restocking a finished tank back to full. No money-collected figure here —
// that's tracked separately via collections, which can happen any time during the cycle.
// Tagging the refill with the cycle it closes, then bumping the tank's cycleSeq, is what
// lets the "collected" badge reset cleanly even if a refill happens the same day as a collection.
function addRefill(tankId, date, litresSold, salesPay, restock){
  var tank = state.tanks.filter(function(x){ return x.id===tankId; })[0];
  var closingCycle = tank ? (tank.cycleSeq||0) : 0;
  var entry = { id: uid(), tankId: tankId, date: date, litresSold: litresSold, salesPay: salesPay, restock: restock, cycle: closingCycle };
  state.refills = state.refills.concat([entry]).sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
  state.tanks = state.tanks.map(function(t){ return t.id===tankId ? Object.assign({},t,{currentLevel:TANK_CAPACITY, lastRefillDate:date, cycleSeq:closingCycle+1}) : t; });
  saveState();
}
function deleteRefill(id){ state.refills = state.refills.filter(function(r){ return r.id!==id; }); saveState(); }
// Correct a wrongly entered refill — date, litres sold, salesperson pay, or restock capital.
// The cycle it closes is left untouched; changing that could desync the tank's cycle sequence.
function editRefill(id, date, litresSold, salesPay, restock){
  state.refills = state.refills.map(function(r){
    if (r.id!==id) return r;
    return Object.assign({}, r, { date: date, litresSold: litresSold, salesPay: salesPay, restock: restock });
  }).sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
  saveState();
}

// ---------- maintenance & water quality ----------
// Both counters piggyback on the tank's existing cycleSeq (refill count) rather than
// keeping a separate tally — cleaningResetAtCycle/waterTestResetAtCycle just remember
// what cycleSeq was the moment the tank was last cleaned/tested, so "cycles since" is
// always cycleSeq minus that stored checkpoint.
function cleaningCyclesSince(t){ var base = (t.cleaningResetAtCycle===undefined||t.cleaningResetAtCycle===null) ? 0 : t.cleaningResetAtCycle; return Math.max((t.cycleSeq||0) - base, 0); }
function waterTestCyclesSince(t){ var base = (t.waterTestResetAtCycle===undefined||t.waterTestResetAtCycle===null) ? 0 : t.waterTestResetAtCycle; return Math.max((t.cycleSeq||0) - base, 0); }
function cleaningStatus(t){
  var n = cleaningCyclesSince(t);
  if (n>=9) return { level:'crisis', badge:'🔴', label:'Tank Very Dirty', message:'Tank has exceeded the recommended cleaning interval. Clean immediately before further refilling.' };
  if (n>=8) return { level:'required', badge:'🟠', label:'Cleaning Required', message:'Tank has completed '+n+' refill cycles. Tank definitely requires cleaning.' };
  if (n>=6) return { level:'soon', badge:'🟡', label:'Cleaning Due Soon', message:'Tank has completed '+n+' refill cycles. Cleaning is recommended before the next refill.' };
  return { level:'ok', badge:'✅', label:'Compliant', message:'' };
}
function waterQualityStatus(t){
  var n = waterTestCyclesSince(t);
  if (n>=9) return { level:'due', badge:'🔬', label:'Bacteriological Analysis Required', message:'Routine bacteriological water quality monitoring is now due. Collect a water sample for laboratory analysis.' };
  return { level:'ok', badge:'✅', label:'Compliant', message:'' };
}
function addCleaning(tankId, date, person, method, disinfectant, remarks){

  state.cleanings = state.cleanings.concat([entry]).sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
  state.tanks = state.tanks.map(function(t){ return t.id===tankId ? Object.assign({},t,{ cleaningResetAtCycle: (t.cycleSeq||0), lastCleanedDate: date }) : t; });
  saveState();
}
function deleteCleaning(id){ state.cleanings = state.cleanings.filter(function(c){ return c.id!==id; }); saveState(); }
function addWaterTest(tankId, date, sampleId, laboratory, result, ecoli, coliforms, remarks){
  var entry = { id: uid(), tankId: tankId, date: date, sampleId: sampleId||'', laboratory: laboratory||'', result: result||'Pass', ecoli: ecoli||'', coliforms: coliforms||'', remarks: remarks||'' };

// Every cycle (the stretch between one refill and the next, or since the tank
// was set up if no refill has closed a cycle yet) gets its own human-readable
// code, e.g. "TANK1-C003". A salesperson can quote this code when they finally
// bring a delayed payment, so it's unambiguous which cycle it pays off even if
// they've already moved into a later cycle.
function pad3(n){ n = n||0; return n<10 ? '00'+n : (n<100 ? '0'+n : ''+n); }
function tankShortCode(t){
  var s = (t.name||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  return s ? s.slice(0,8) : 'TANK';
}
function cycleCode(t, cycleNum){ return tankShortCode(t) + '-C' + pad3((cycleNum||0)+1); }
function cycleDateLabel(o){
  if (o.from && o.to) return o.from+' → '+o.to;
  if (o.from && !o.to) return 'since '+o.from+' (ongoing)';
  if (!o.from && o.to) return 'up to '+o.to;
  return 'since tank setup';
}

// Every cycle from 0 up to the tank's current open cycle that hasn't reached
// COLLECTION_TARGET yet, oldest first. This is the FIFO queue of unpaid codes.
// Each entry also carries the date range the cycle covers: "from" is when the
// previous refill closed the prior cycle (i.e. when this one started selling),
// and "to" is the date this cycle's own refill closed it — or null if it's
// still the tank's current open cycle.
function tankOutstandingCycles(t){
  if (!isIncomeTank(t)) return [];
  var cur = t.cycleSeq||0;
  var tRefills = state.refills.filter(function(r){ return r.tankId===t.id; });
  var out = [];
  for (var i=0;i<=cur;i++){
    var sum = state.collections.filter(function(c){ return c.tankId===t.id && c.cycle===i; })
      .reduce(function(a,c){ return a+c.amount; },0);
    if (sum < COLLECTION_TARGET) {
      var closingRefill = tRefills.filter(function(r){ return r.cycle===i; })[0];
      var openingRefill = i>0 ? tRefills.filter(function(r){ return r.cycle===i-1; })[0] : null;
      out.push({ cycle: i, collected: sum, code: cycleCode(t,i), from: openingRefill ? openingRefill.date : null, to: closingRefill ? closingRefill.date : null });
    }
  }
  return out;
}

// All cycles from 0 to the tank's current one, paid or not — used when correcting a
// collection's code, since the entry might need to move to a cycle that's already settled.
function tankAllCycles(t){
  var cur = t.cycleSeq||0;
  var tRefills = state.refills.filter(function(r){ return r.tankId===t.id; });
  var out = [];
  for (var i=0;i<=cur;i++){
    var closingRefill = tRefills.filter(function(r){ return r.cycle===i; })[0];
    var openingRefill = i>0 ? tRefills.filter(function(r){ return r.cycle===i-1; })[0] : null;
    out.push({ cycle: i, code: cycleCode(t,i), from: openingRefill ? openingRefill.date : null, to: closingRefill ? closingRefill.date : null });
  }
  return out;
}

// Collecting the owner's cut: can happen at any tank level, any number of times per cycle.
// Tagged with a specific cycle/code so it's unambiguous which cycle it pays toward — this
// lets a late payment be matched to an old code even after newer cycles have opened.
// If no cycle is given, it defaults to the oldest unpaid code (FIFO), not the newest cycle,
// so payments naturally clear the backlog before counting toward anything newer.
function addCollection(tankId, date, amount, cycle){
  var tank = state.tanks.filter(function(x){ return x.id===tankId; })[0];
  var targetCycle;
  if (cycle === undefined || cycle === null || cycle === '') {
    var outstanding = tank ? tankOutstandingCycles(tank) : [];
    targetCycle = outstanding.length ? outstanding[0].cycle : (tank ? (tank.cycleSeq||0) : 0);
  } else {
    targetCycle = parseInt(cycle, 10);
  }
  var entry = { id: uid(), tankId: tankId, date: date, amount: amount, cycle: targetCycle };
  state.collections = state.collections.concat([entry]).sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
  saveState();
  return entry;
}
function deleteCollection(id){ state.collections = state.collections.filter(function(c){ return c.id!==id; }); saveState(); }
function filterCollections(tankId){

}
function filterRefills(tankId){

// Filters the Tanks tab's list of tank cards by name/location/salesperson, without a
// full re-render — keeps the input focused while typing, same pattern as the per-tank
// collection/refill search above.
function filterTanks(){
  var input = document.getElementById('tank-search');
  if (!input) return;
  var q = input.value.toLowerCase().trim();
  var cards = document.querySelectorAll('[data-tank-card]');
  var shown = 0;
  cards.forEach(function(card){
    var text = card.getAttribute('data-search') || '';
    var match = !q || text.indexOf(q) !== -1;
    card.style.display = match ? '' : 'none';
    if (match) shown++;
  });
  var empty = document.getElementById('tank-search-empty');
  if (empty) empty.style.display = (q && shown===0) ? '' : 'none';
}
// Correct a wrongly entered collection — date, amount, and/or which code it's tagged against.
function editCollection(id, date, amount, cycle){
  state.collections = state.collections.map(function(c){
    if (c.id!==id) return c;
    return Object.assign({}, c, { date: date, amount: amount, cycle: parseInt(cycle,10) });
  }).sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
  saveState();
}

// A tank only counts as "collected" once EVERY code up to and including its current
// open cycle has reached COLLECTION_TARGET. A fresh payment against the newest cycle
// no longer masks an older unpaid code — the badge stays red until the whole chain clears.
function tankPaidStatus(t){
  return tankOutstandingCycles(t).length === 0;
}

// Mirror of tankOutstandingCycles: every cycle that HAS reached COLLECTION_TARGET,
// with the total collected and the date of its last payment. Powers the "paid" side
// of the Payments tab, so settled cycles don't just disappear from view.
function tankPaidCycles(t){
  var outstandingSet = {};
  tankOutstandingCycles(t).forEach(function(o){ outstandingSet[o.cycle] = true; });
  return tankAllCycles(t).filter(function(o){ return !outstandingSet[o.cycle]; }).map(function(o){
    var matches = state.collections.filter(function(c){ return c.tankId===t.id && c.cycle===o.cycle; });
    var sum = matches.reduce(function(a,c){ return a+c.amount; },0);
    var lastDate = matches.reduce(function(latest,c){ return (!latest || c.date>latest) ? c.date : latest; }, null);
    return Object.assign({}, o, { collected: sum, lastPaidDate: lastDate });
  });
}

// A single, plain-language view of every cycle across every tank: which are still
// owed and which are already settled — no need to decode a code to know what's due.
function renderPayments(){
  var canCollect = !currentUser || currentUser.role === 'admin';
  var pending = [];
  var paid = [];
  incomeTanks().forEach(function(t){
    tankOutstandingCycles(t).forEach(function(o){ pending.push({ tank: t, o: o }); });
    tankPaidCycles(t).forEach(function(o){ paid.push({ tank: t, o: o }); });
  });
  pending.sort(function(a,b){
    var da = a.o.from || '0000-00-00', db = b.o.from || '0000-00-00';
    return new Date(da) - new Date(db);
  });
  paid.sort(function(a,b){
    var da = a.o.lastPaidDate || a.o.to || a.o.from || '0000-00-00';
    var db = b.o.lastPaidDate || b.o.to || b.o.from || '0000-00-00';
    return new Date(db) - new Date(da);
  });

  var html = '<div style="font-size:12.5px;color:'+C.inkSoft+';margin-bottom:14px">Every water cycle, in one place — no codes to decode. Tap a pending one to record what came in.</div>';

  html += '<div class="card" style="margin-bottom:14px">' +
    '<div class="serif" style="font-weight:600;font-size:17px;margin-bottom:2px">Still pending</div>' +
    '<div style="font-size:12px;color:'+C.inkSoft+';margin-bottom:12px">Oldest first — clear these before newer ones.</div>';
  if (!pending.length) {
    html += '<div style="font-size:13px;color:'+C.cash+';display:flex;align-items:center;gap:8px">'+icon('check',16,C.cash)+' Nothing outstanding right now.</div>';
  } else {
    html += '<div style="display:flex;flex-direction:column;gap:10px">';
    pending.forEach(function(row, idx){
      var t = row.tank, o = row.o;
      var remaining = Math.max(COLLECTION_TARGET - o.collected, 0);
      var orderRefill = state.refills.filter(function(r){ return r.tankId===t.id && r.cycle===o.cycle; })[0];
      html += '<div style="border:1px solid '+C.line+';border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px">' +
        '<div style="flex:1;min-width:0">' +
        '<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">'+codePill(o.code)+(idx===0?' <span style="font-weight:600;color:'+C.crisis+';font-size:11px">oldest</span>':'')+'</div>' +
        '<div style="font-weight:600;font-size:13.5px">'+esc(t.name)+'</div>' +
        '<div style="font-size:11.5px;color:'+C.inkSoft+';margin-top:2px">Order: '+esc(cycleDateLabel(o))+(orderRefill ? ' · '+orderRefill.litresSold+'L sold, closed '+orderRefill.date : ' · still selling, not closed yet')+'</div>' +
        '<div style="font-size:12.5px;margin-top:3px">Payment: ' +
        (o.collected>0
          ? ('<span style="color:'+C.amber+';font-weight:600">R'+o.collected.toLocaleString()+' of R'+COLLECTION_TARGET+' in</span> · R'+remaining.toLocaleString()+' still owed')
          : ('<span style="color:'+C.crisis+';font-weight:600">R'+COLLECTION_TARGET+' owed</span>')) +
        '</div>' +
        '</div>' +
        (canCollect ? '<button data-action="goto-collect" data-tank="'+esc(t.id)+'" data-cycle="'+o.cycle+'" style="flex-shrink:0;background:'+C.cash+';color:#fff;border:none;border-radius:9px;padding:9px 12px;font-weight:600;font-size:12px;white-space:nowrap">Record payment</button>' : '') +
        '</div>';
    });
    html += '</div>';
  }
  html += '</div>';

  html += '<div class="card">' +
    '<div class="serif" style="font-weight:600;font-size:17px;margin-bottom:2px">Already settled</div>' +
    '<div style="font-size:12px;color:'+C.inkSoft+';margin-bottom:12px">Most recent first.</div>';
  if (!paid.length) {
    html += '<div style="font-size:13px;color:'+C.inkSoft+'">Nothing settled yet.</div>';
  } else {
    html += '<div style="display:flex;flex-direction:column;gap:8px">';
    paid.slice(0,15).forEach(function(row){
      var t = row.tank, o = row.o;
      var orderRefill = state.refills.filter(function(r){ return r.tankId===t.id && r.cycle===o.cycle; })[0];
      html += '<div style="border-top:1px solid '+C.line+';padding-top:8px">' +
        '<div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">'+codePill(o.code)+'<span style="font-weight:600;font-size:13px">'+esc(t.name)+'</span></div>' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:8px">' +
        '<div style="font-size:11.5px;color:'+C.inkSoft+';min-width:0">Order: '+esc(cycleDateLabel(o))+(orderRefill?' · '+orderRefill.litresSold+'L sold':'')+'</div>' +
        '<div style="text-align:right;flex-shrink:0;font-size:11.5px;color:'+C.inkSoft+'">Payment: <span style="color:'+C.cash+';font-weight:600">R'+o.collected.toLocaleString()+'</span> on '+esc(o.lastPaidDate||'—')+'</div>' +
        '</div></div>';
    });
    html += '</div>';
    if (paid.length > 15) html += '<div style="font-size:11.5px;color:'+C.inkSoft+';margin-top:8px">+'+(paid.length-15)+' more — see each tank\'s history in the Tanks tab.</div>';
  }
  html += '</div>';

  return html;
}

// ---------- lending (separate business) ----------
var DEFAULT_INTEREST = 0.4; // 40%

function addLoan(name, amountBorrowed, dateBorrowed, dateDue, amountDue, currency, whatsapp, lateFeePct, skipAccountTx){
  var entry = { id: uid(), name: name, whatsapp: whatsapp||'', amountBorrowed: amountBorrowed, dateBorrowed: dateBorrowed, dateDue: dateDue, amountDue: amountDue, currency: currency || 'USD', cleared: false, dateCleared: null, lateFeePct: lateFeePct||0, payments: [], titheAccrued: false };
  state.loans = state.loans.concat([entry]).sort(function(a,b){ return new Date(a.dateDue)-new Date(b.dateDue); });
  // Issuing a loan is money leaving the Business Account — deducted automatically.
  // Exception: backdated entries, where the cash already left before the account's
  // recorded history begins — posting a loan-out here would deduct that money a
  // second time.
  if (!skipAccountTx) {
    addAccountTx('loan-out', entry.currency, -amountBorrowed, dateBorrowed, 'Loan to '+name, { loanId: entry.id });
  }
  saveState();
  return entry;
}
// Total of every part-payment recorded against a loan so far.
function loanTotalPaid(l){
  return (l.payments||[]).reduce(function(a,p){ return a+p.amount; }, 0);
}
// Late fee accrued on the unpaid balance for each day (or fraction of a day) past the
// due date, at the loan's own daily rate. Walks the payment timeline so the fee is
// charged on whatever balance was actually outstanding in each stretch, not on the
// original amount due the whole time — a payment partway through overdue days
// correctly reduces the balance the fee accrues on from that point forward.
function loanLateFee(l){
  var rate = (l.lateFeePct||0) / 100;
  if (!rate) return 0;
  var due = l.dateDue;
  var endDate = l.cleared ? (l.dateCleared || due) : todayISO();
  if (new Date(endDate) <= new Date(due)) return 0;
  var payments = (l.payments||[]).slice().sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
  var priorPayments = payments.filter(function(p){ return new Date(p.date) < new Date(due); })
    .reduce(function(a,p){ return a+p.amount; }, 0);
  var balance = l.amountDue - priorPayments;
  var cursor = due;
  var fee = 0;
  payments.filter(function(p){ return new Date(p.date) >= new Date(due) && new Date(p.date) <= new Date(endDate); })
    .forEach(function(p){
      fee += Math.max(balance, 0) * rate * daysBetween(cursor, p.date);
      balance -= p.amount;
      cursor = p.date;
    });
  fee += Math.max(balance, 0) * rate * daysBetween(cursor, endDate);
  return Math.max(fee, 0);
}
// Whole days past the due date (0 if not overdue, or already cleared before the due date).
function loanDaysOverdue(l){
  var endDate = l.cleared ? (l.dateCleared || todayISO()) : todayISO();
  if (new Date(endDate) <= new Date(l.dateDue)) return 0;
  return Math.floor(daysBetween(l.dateDue, endDate));
}
// What's still owed right now: amount due, plus any accrued late fee, minus every
// part-payment received so far. Never negative.
function loanBalanceRemaining(l){
  return Math.max(l.amountDue + loanLateFee(l) - loanTotalPaid(l), 0);
}
// Keeps a loan's tithe accrual in sync with how much of its interest (original
// interest + any accrued late fee) has actually been recovered via payments so far.
// Interest is treated as recovered before principal, and the loan's own late fee
// keeps growing day by day even between payments — so this is called after any event
// that could shift what's recovered (a new payment, a deleted payment, a manual
// clear/reopen) and simply tithes the delta between what's recovered now and what was
// already tithed. That's what makes partial payments tithe their own share of interest
// as they land, instead of the whole interest amount being tithed once at full clearance.
function reconcileLoanTithe(loan, date){
  var interestNow = (loan.amountDue - loan.amountBorrowed) + loanLateFee(loan);
  var paidNow = loanTotalPaid(loan);
  var interestRecovered = Math.max(Math.min(interestNow, paidNow), 0);
  var priorBase = loan.titheInterestBase || 0;
  var delta = interestRecovered - priorBase;
  if (Math.abs(delta) > 0.005) {
    accrueTithe(delta, loan.currency, date || todayISO(),
      (delta > 0 ? 'Tithe on loan interest' : 'Tithe reversal') + ' — ' + loan.name,
      { loanId: loan.id });
    recordInterestIncome(delta, loan.currency, date || todayISO(),
      (delta > 0 ? 'Interest income' : 'Interest income reversal') + ' — ' + loan.name,
      { loanId: loan.id });
  }
  return Object.assign({}, loan, { titheInterestBase: interestRecovered, titheAccrued: loan.cleared && interestRecovered > 0 });
}
// Records one repayment (full or partial) against a loan. Each payment posts its own
// entry to the Business Account as it comes in, rather than waiting for the loan to be
// fully settled — so partial repayments show up in your books right away, and so does
// their share of the tithe (via reconcileLoanTithe). Once enough payments have come in
// to cover the amount due, the loan auto-clears.
function addLoanPayment(id, amount, date){
  var loan = state.loans.filter(function(x){ return x.id===id; })[0];
  if (!loan || !amount || amount <= 0) return;
  var pdate = date || todayISO();
  loan = Object.assign({}, loan, { payments: (loan.payments||[]).concat([{ id: uid(), amount: amount, date: pdate }]) });
  addAccountTx('loan-repayment', loan.currency, amount, pdate, 'Loan payment received — '+loan.name, { loanId: loan.id });
  if (!loan.cleared && loanBalanceRemaining(loan) <= 0.005) {
    loan = Object.assign({}, loan, { cleared: true, dateCleared: pdate });
  }
  loan = reconcileLoanTithe(loan, pdate);
  state.loans = state.loans.map(function(l){ return l.id===id ? loan : l; });
  saveState();
}
// Removes a single payment entry (for correcting a mis-entered amount or date) and
// reverses the matching Business Account entry. If that payment was what had pushed
// the loan to "Cleared", the loan reopens. Either way, reconcileLoanTithe unwinds
// whatever share of the tithe that payment's interest portion had accrued.
function deleteLoanPayment(loanId, paymentId){
  var loan = state.loans.filter(function(x){ return x.id===loanId; })[0];
  if (!loan) return;
  var p = (loan.payments||[]).filter(function(x){ return x.id===paymentId; })[0];
  if (!p) return;
  loan = Object.assign({}, loan, { payments: loan.payments.filter(function(x){ return x.id!==paymentId; }) });
  addAccountTx('loan-payment-reversal', loan.currency, -p.amount, todayISO(), 'Loan payment reversed — '+loan.name, { loanId: loan.id });
  if (loan.cleared && loanBalanceRemaining(loan) > 0.005) {
    loan = Object.assign({}, loan, { cleared: false, dateCleared: null });
  }
  loan = reconcileLoanTithe(loan, todayISO());
  state.loans = state.loans.map(function(l){ return l.id===loanId ? loan : l; });
  saveState();
}
// "Settle remaining" pays off whatever balance is left in one go (the common case when
// there were no partial payments); "Reopen" just un-marks a loan that was cleared by
// mistake — it leaves every payment already received on the books (that money genuinely
// came in) and reconcileLoanTithe adjusts the tithe to match whatever's still recovered.
function toggleLoanCleared(id){
  var loan = state.loans.filter(function(x){ return x.id===id; })[0];
  if (!loan) return;
  if (!loan.cleared) {
    var remaining = loanBalanceRemaining(loan);
    if (remaining > 0.005) { addLoanPayment(id, remaining, todayISO()); return; }
    loan = Object.assign({}, loan, { cleared: true, dateCleared: todayISO() });
    loan = reconcileLoanTithe(loan, todayISO());
    state.loans = state.loans.map(function(l){ return l.id===id ? loan : l; });
    saveState();
  } else {
    loan = Object.assign({}, loan, { cleared: false, dateCleared: null });
    loan = reconcileLoanTithe(loan, todayISO());
    state.loans = state.loans.map(function(l){ return l.id===id ? loan : l; });
    saveState();
  }
}
function deleteLoan(id){
  var l = state.loans.filter(function(x){ return x.id===id; })[0];
  // Deleting a loan undoes the original "money out" as if it never happened, minus
  // whatever principal has already come back in via recorded payments — so a loan
  // that's had some part-payments only refunds what's still genuinely outstanding,
  // instead of double-crediting money that was already posted when each payment landed.
  if (l && !l.cleared && !l.badDebt) {
    var stillOut = Math.max(l.amountBorrowed - loanTotalPaid(l), 0);
    if (stillOut > 0) {
      addAccountTx('loan-deleted-refund', l.currency, stillOut, todayISO(), 'Loan deleted — principal returned to account for '+l.name, { loanId: l.id });
    }
  }
  // If the loan was still open (not cleared), any interest tithed so far on it — via
  // partial payments — needs to be pulled back out of the tithe pool, since that
  // interest was only provisionally recovered and the loan is going away unresolved.
  // But once a loan has been marked Cleared, its interest was genuinely earned and
  // already tithed as real profit — deleting the loan record afterward (e.g. just to
  // tidy up) must NOT withdraw that tithe. Same protection applies to Bad Debt loans:
  // the loss was deliberate and already correctly recorded, so deleting the loan
  // record afterward (to tidy up) must not refund or reverse anything either.
  if (l && !l.cleared && !l.badDebt && (l.titheInterestBase || 0) > 0.005) {
    accrueTithe(-l.titheInterestBase, l.currency, todayISO(), 'Tithe reversal (loan deleted) — '+l.name, { loanId: l.id });
    recordInterestIncome(-l.titheInterestBase, l.currency, todayISO(), 'Interest income reversal (loan deleted) — '+l.name, { loanId: l.id });
  }
  state.loans = state.loans.filter(function(l){ return l.id!==id; });
  saveState();
}
// Marks a loan as bad debt instead of deleting it — the borrower's name, amount, and
// full history stay visible under a "Bad Debt" status. No account transaction is
// posted here: the money already left the business when the loan was issued
// (loan-out), so that entry alone is the correct, permanent record of the loss. This
// is the opposite of deleteLoan, which wrongly credits the money back as if it had
// been recovered — this action deliberately leaves that credit out.
function markLoanBadDebt(id){
  var l = state.loans.filter(function(x){ return x.id===id; })[0];
  if (!l || l.cleared || l.badDebt) return;
  var balance = loanBalanceRemaining(l);
  var updated = Object.assign({}, l, { badDebt: true, dateBadDebt: todayISO(), badDebtAmount: balance, recoveries: l.recoveries||[] });
  state.loans = state.loans.map(function(x){ return x.id===id ? updated : x; });
  saveState();
}
// If a borrower marked as bad debt eventually pays after all, record it here rather
// than as generic other-income — it stays linked to the original loan, moves the
// loan to "Recovered" once fully paid back, and still gets tithed like any income.
// Only the interest portion of what's recovered is tithed/counted as P&L income —
// recovering principal is just capital coming back, same as an ordinary loan
// repayment, which isn't income either. That's why this posts as a 'loan-repayment'
// account transaction (real cash in, but excluded from Total Income) rather than
// 'other-income', with only the interest slice separately pushed through the tithe
// and interest-income ledgers, exactly like a normal payment would be.
function recordBadDebtRecovery(id, amount, date, notes){
  var l = state.loans.filter(function(x){ return x.id===id; })[0];
  if (!l || !l.badDebt || !amount) return null;
  var desc = 'Bad debt recovered — '+l.name+(notes?' ('+notes+')':'');
  addAccountTx('loan-repayment', l.currency, amount, date, desc, { loanId: l.id, badDebtRecovery: true });
  var interestNow = (l.amountDue - l.amountBorrowed) + loanLateFee(l);
  var recoveredBefore = loanRecoveredTotal(l);
  var interestBefore = Math.max(Math.min(interestNow, recoveredBefore), 0);
  var interestAfter = Math.max(Math.min(interestNow, recoveredBefore + amount), 0);
  var interestDelta = interestAfter - interestBefore;
  if (interestDelta > 0.005) {
    accrueTithe(interestDelta, l.currency, date, 'Tithe on '+desc, { loanId: l.id });
    recordInterestIncome(interestDelta, l.currency, date, 'Interest income — '+desc, { loanId: l.id });
  }
  var entry = { id: uid(), date: date||todayISO(), amount: amount, notes: notes||'' };
  var updated = Object.assign({}, l, { recoveries: (l.recoveries||[]).concat([entry]) });
  state.loans = state.loans.map(function(x){ return x.id===id ? updated : x; });
  saveState();
  return entry;
}

// ---------- business account ----------
var ACCT_TX_LABELS = {
  'opening': 'Opening Balance',
  'tank-deposit': 'Tank Collection Deposit',
  'loan-out': 'Loan Issued',
  'loan-repayment': 'Loan Repaid',
  'loan-payment-reversal': 'Loan Payment Reversed',
  'loan-reopen-reversal': 'Loan Reopened (reversal)',
  'loan-deleted-refund': 'Loan Deleted (refund)',
  'other-income': 'Other Income',
  'withdrawal': 'Cash Withdrawal',
  'tithe-withdrawal': 'Tithe Given',
  'transfer-out': 'Transfer to Cash in Hand',
  'transfer-in': 'Transfer from Cash in Hand'
};
var CASH_TX_LABELS = {
  'transfer-in': 'Transfer from Account',
  'transfer-out': 'Transfer to Account'
};
// Adds a signed entry to the Business Account ledger. Positive amounts are money in,
// negative are money out. Nothing in this ledger is ever edited or deleted once saved —
// corrections are made with an offsetting entry, which is what keeps it a true audit trail.
function addAccountTx(type, currency, amount, date, description, meta){
  var entry = { id: uid(), date: date||todayISO(), type: type, currency: currency||'USD', amount: amount, description: description||'', meta: meta||null, recordedAt: todayISO() };
  state.accountTx = state.accountTx.concat([entry]).sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
  saveState();
  return entry;
}
function addCashTx(type, currency, amount, date, description, meta){
  var entry = { id: uid(), date: date||todayISO(), type: type, currency: currency||'USD', amount: amount, description: description||'', meta: meta||null };
  state.cashTx = state.cashTx.concat([entry]).sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
  saveState();
  return entry;
}
function accountBalance(currency){
  return state.accountTx.filter(function(t){ return (t.currency||'USD')===currency; }).reduce(function(a,t){ return a+t.amount; },0);
}
function cashBalance(currency){
  return state.cashTx.filter(function(t){ return (t.currency||'USD')===currency; }).reduce(function(a,t){ return a+t.amount; },0);
}
function hasAccountActivity(currency){
  return state.accountTx.some(function(t){ return (t.currency||'USD')===currency; }) || state.cashTx.some(function(t){ return (t.currency||'USD')===currency; });
}
function depositTankCollection(amount, date, notes){
  var entry = addAccountTx('tank-deposit', 'USD', amount, date, 'Tank collection deposit'+(notes?' — '+notes:''), null);
  accrueTithe(amount, 'USD', date, 'Tithe on tank collection'+(notes?' — '+notes:''), null);
  return entry;
}
function addOtherIncome(amount, currency, date, source, notes, category){
  category = category || 'operating';
  var desc = 'Other income'+(source?' — '+source:'')+(notes?' ('+notes+')':'');
  var entry = addAccountTx('other-income', currency, amount, date, desc, { source: source||'', notes: notes||'', category: category });
  // Capital recovery (e.g. selling an old asset) is money coming back on capital
  // already spent — not new profit — so unlike ordinary income, it isn't tithed.
  // Same principle as loan principal repayment: only genuine gains get tithed.
  if (category === 'operating') {
    accrueTithe(amount, currency, date, 'Tithe on other income'+(source?' — '+source:''), { source: source||'' });
  }
  return entry;
}

// ---------- tithes (10% of income, set aside for withdrawal at any time) ----------
var TITHE_RATE = 0.10;
var TITHE_TX_LABELS = { 'accrual': 'Tithe accrued', 'withdrawal': 'Tithe withdrawn' };
// Tithes get their own ledger, separate from the Business Account ledger, so the
// "available to withdraw" figure is always exactly 10% of income recorded, minus
// whatever's already been withdrawn — never edited or deleted, only offset, just
// like the account and cash ledgers.
function addTitheTx(type, currency, amount, date, description, meta){
  var entry = { id: uid(), date: date||todayISO(), type: type, currency: currency||'USD', amount: amount, description: description||'', meta: meta||null };
  state.titheTx = state.titheTx.concat([entry]).sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
  saveState();
  return entry;
}
// Called automatically whenever income is recorded (tank deposits, other income,
// loan interest earned). Pass a negative incomeAmount to reverse a tithe accrual
// (e.g. a loan repayment being reopened).
function accrueTithe(incomeAmount, currency, date, description, meta){
  if (!incomeAmount) return null;
  return addTitheTx('accrual', currency, incomeAmount*TITHE_RATE, date, description||'Tithe accrued', meta);
}
function tithePool(currency){
  return state.titheTx.filter(function(t){ return (t.currency||'USD')===currency; }).reduce(function(a,t){ return a+t.amount; },0);
}
function hasTitheActivity(currency){
  return state.titheTx.some(function(t){ return (t.currency||'USD')===currency; });
}
// ---------- interest income (permanent record, independent of loan lifecycle) ----------
// Interest income needs its own ledger for the same reason tithes do: without one,
// "Total Income" is recalculated live from loans still on record, so deleting a
// cleared loan silently erases interest it genuinely earned from the P&L. This mirrors
// the tithe ledger — recorded once, only ever offset (never edited/deleted), and
// reversed on delete only if the loan was still open (unresolved) at the time.
function recordInterestIncome(amount, currency, date, description, meta){
  if (!amount) return null;
  var entry = { id: uid(), date: date||todayISO(), type: amount>0?'accrual':'reversal', currency: currency||'USD', amount: amount, description: description||'', meta: meta||null };
  state.interestIncomeTx = state.interestIncomeTx.concat([entry]).sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
  saveState();
  return entry;
}
function interestIncomeTotal(currency){
  return state.interestIncomeTx.filter(function(t){ return (t.currency||'USD')===currency; }).reduce(function(a,t){ return a+t.amount; },0);
}
// Withdrawing a tithe both lowers the tithe pool AND takes that money out of the
// real Business Account — it's genuinely leaving the business to be given away.
function withdrawTithe(amount, currency, date, notes){
  var note = notes ? ' — '+notes : '';
  addTitheTx('withdrawal', currency, -amount, date, 'Tithe withdrawn'+note, null);
  return addAccountTx('tithe-withdrawal', currency, -amount, date, 'Tithe withdrawn'+note, null);
}
function withdrawCash(amount, currency, date, notes, category){
  return addAccountTx('withdrawal', currency, -amount, date, 'Cash withdrawal'+(notes?' — '+notes:''), { category: category||'operating' });
}
// Moves money between the Business Account and physical Cash in Hand. Each transfer
// writes a matching pair of entries — one on each ledger — so both sides stay in sync.
function transferAccountCash(direction, amount, currency, date, notes){
  var note = notes ? ' — '+notes : '';
  if (direction === 'to-cash') {
    addAccountTx('transfer-out', currency, -amount, date, 'Transfer to cash in hand'+note, null);
    addCashTx('transfer-in', currency, amount, date, 'Transfer from account'+note, null);
  } else {
    addCashTx('transfer-out', currency, -amount, date, 'Transfer to account'+note, null);
    addAccountTx('transfer-in', currency, amount, date, 'Transfer from cash in hand'+note, null);
  }
}
function computeAccountTotals(currency){
  var tx = state.accountTx.filter(function(t){ return (t.currency||'USD')===currency; });
  function sumType(type){ return tx.filter(function(t){ return t.type===type; }).reduce(function(a,t){ return a+t.amount; },0); }
  var lending = computeLendingTotals(currency);
  return {
    balance: tx.reduce(function(a,t){ return a+t.amount; },0),
    tankDeposited: sumType('tank-deposit'),
    loanRepayments: sumType('loan-repayment'),
    interestEarned: lending.interestEarned,
    lentOut: lending.outstandingPrincipal,
    cashInHand: cashBalance(currency),
    runningCapital: tx.reduce(function(a,t){ return a+t.amount; },0) + cashBalance(currency) + lending.outstandingPrincipal
  };
}
// Lifetime Profit & Loss. Money lent out and money repaid are asset movements, not
// income or expense — only interest earned, deposits, and true business costs count.
function computeProfitLoss(currency){
  var tx = state.accountTx.filter(function(t){ return (t.currency||'USD')===currency; });
  function sumType(type){ return tx.filter(function(t){ return t.type===type; }).reduce(function(a,t){ return a+t.amount; },0); }
  function sumWithdrawCat(cat){
    return -tx.filter(function(t){ return t.type==='withdrawal' && ((t.meta&&t.meta.category)||'operating')===cat; })
      .reduce(function(a,t){ return a+t.amount; },0);
  }
  var tankIncome = sumType('tank-deposit');
  var interestIncome = interestIncomeTotal(currency);
  var otherIncomeTx = tx.filter(function(t){ return t.type==='other-income'; });
  var otherIncome = otherIncomeTx.filter(function(t){ return ((t.meta&&t.meta.category)||'operating')==='operating'; }).reduce(function(a,t){ return a+t.amount; },0);
  var capitalRecovery = otherIncomeTx.filter(function(t){ return t.meta&&t.meta.category==='capital-recovery'; }).reduce(function(a,t){ return a+t.amount; },0);
  var totalIncome = tankIncome + interestIncome + otherIncome;
  var runningCosts = sumWithdrawCat('operating');
  var staffExpense = sumWithdrawCat('staff');
  var operatingExpense = runningCosts + staffExpense;
  var capitalExpenditure = sumWithdrawCat('capital');
  var lossWriteOff = sumWithdrawCat('loss');
  var ownerDraw = sumWithdrawCat('draw');
  var lending = computeLendingTotals(currency);
  var badDebtLoss = Math.max(lending.badDebtTotal - lending.recoveredTotal, 0);
  var withdrawals = -sumType('withdrawal');
  var titheGiven = -sumType('tithe-withdrawal');
  var totalExpenses = withdrawals + titheGiven + badDebtLoss - capitalRecovery;
  var operatingProfit = totalIncome - operatingExpense;
  return { tankIncome: tankIncome, interestIncome: interestIncome, otherIncome: otherIncome, totalIncome: totalIncome,
    runningCosts: runningCosts, staffExpense: staffExpense,
    operatingExpense: operatingExpense, capitalExpenditure: capitalExpenditure, capitalRecovery: capitalRecovery, lossWriteOff: lossWriteOff, ownerDraw: ownerDraw, badDebtLoss: badDebtLoss,
    operatingProfit: operatingProfit,
    withdrawals: withdrawals, titheGiven: titheGiven, totalExpenses: totalExpenses, net: totalIncome - totalExpenses };
}
// Groups every account movement by month for a simple cash-flow report, oldest first,
// with a running ending balance so each row reads like a mini bank statement.
function computeMonthlyCashFlow(currency){
  var tx = state.accountTx.filter(function(t){ return (t.currency||'USD')===currency; }).slice().sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
  if (!tx.length) return [];
  var byMonth = {};
  var order = [];
  tx.forEach(function(t){
    var mk = monthKey(t.date);
    if (!byMonth[mk]) { byMonth[mk] = { month: mk, inflow: 0, outflow: 0 }; order.push(mk); }
    if (t.amount >= 0) byMonth[mk].inflow += t.amount; else byMonth[mk].outflow += -t.amount;
  });
  var running = 0;
  return order.map(function(mk){
    var m = byMonth[mk];
    running += (m.inflow - m.outflow);
    return { month: mk, inflow: m.inflow, outflow: m.outflow, net: m.inflow - m.outflow, endingBalance: running };
  });
}
// Same categorisation as computeProfitLoss (lifetime), but bucketed by calendar month
// so a given month's profit can be read on its own and compared side-by-side against
// other months — the lifetime statement alone can't show whether things are
// improving or declining month to month.
function computeMonthlyProfitLoss(currency){
  var tx = state.accountTx.filter(function(t){ return (t.currency||'USD')===currency; });
  var interestTx = state.interestIncomeTx.filter(function(t){ return (t.currency||'USD')===currency; });
  var loans = state.loans.filter(function(l){ return (l.currency||'USD')===currency && l.badDebt; });
  if (!tx.length && !interestTx.length && !loans.length) return [];
  var byMonth = {};
  var order = [];
  function bucket(mk){
    if (!byMonth[mk]) {
      byMonth[mk] = { month: mk, tankIncome: 0, interestIncome: 0, otherIncome: 0, capitalRecovery: 0,
        runningCosts: 0, staffExpense: 0, withdrawals: 0, titheGiven: 0, badDebtLoss: 0 };
      order.push(mk);
    }
    return byMonth[mk];
  }
  tx.forEach(function(t){
    var mk = monthKey(t.date);
    var b = bucket(mk);
    if (t.type === 'tank-deposit') b.tankIncome += t.amount;
    else if (t.type === 'other-income' && ((t.meta&&t.meta.category)||'operating')==='operating') b.otherIncome += t.amount;
    else if (t.type === 'other-income' && (t.meta&&t.meta.category)==='capital-recovery') b.capitalRecovery += t.amount;
    else if (t.type === 'tithe-withdrawal') b.titheGiven += -t.amount;
    if (t.type === 'withdrawal') {
      b.withdrawals += -t.amount;
      if (((t.meta&&t.meta.category)||'operating')==='operating') b.runningCosts += -t.amount;
      else if ((t.meta&&t.meta.category)==='staff') b.staffExpense += -t.amount;
    }
  });
  interestTx.forEach(function(t){
    var b = bucket(monthKey(t.date));
    b.interestIncome += t.amount;
  });
  // Bad debt is dated by when a loan was written off, and any later recovery offsets
  // the loss in the month it actually came back — same lifetime totals as
  // computeLendingTotals, just split across the months the events happened in.
  loans.forEach(function(l){
    if (l.dateBadDebt) bucket(monthKey(l.dateBadDebt)).badDebtLoss += (l.badDebtAmount||0);
    (l.recoveries||[]).forEach(function(r){ bucket(monthKey(r.date)).badDebtLoss -= r.amount; });
  });
  order.sort(function(a,b){ return a<b ? -1 : a>b ? 1 : 0; });
  var prevProfit = null;
  return order.map(function(mk){
    var m = byMonth[mk];
    var income = m.tankIncome + m.interestIncome + m.otherIncome;
    var operatingExpense = m.runningCosts + m.staffExpense;
    var operatingProfit = income - operatingExpense;
    var totalExpenses = m.withdrawals + m.titheGiven + m.badDebtLoss - m.capitalRecovery;
    var netProfit = income - totalExpenses;
    var row = { month: mk, tankIncome: m.tankIncome, interestIncome: m.interestIncome, otherIncome: m.otherIncome,
      income: income, runningCosts: m.runningCosts, staffExpense: m.staffExpense, operatingExpense: operatingExpense,
      operatingProfit: operatingProfit, withdrawals: m.withdrawals, titheGiven: m.titheGiven, badDebtLoss: m.badDebtLoss,
      capitalRecovery: m.capitalRecovery, netProfit: netProfit,
      change: prevProfit===null ? null : operatingProfit - prevProfit };
    prevProfit = operatingProfit;
    return row;
  });
}

function loanStatus(l){
  if (l.badDebt) return loanRecoveredTotal(l) >= (l.badDebtAmount||0) - 0.005 ? 'Recovered' : 'Bad Debt';
  if (l.cleared) return 'Cleared';
  if (new Date(todayISO()) > new Date(l.dateDue)) return 'Overdue';
  if (loanTotalPaid(l) > 0) return 'Partial';
  return 'Pending';
}
function loanRecoveredTotal(l){
  return (l.recoveries||[]).reduce(function(a,r){ return a+r.amount; }, 0);
}
function loanStatusColor(status){
  if (status === 'Cleared') return C.cash;
  if (status === 'Recovered') return C.cash;
  if (status === 'Bad Debt') return C.crisis;
  if (status === 'Overdue') return C.crisis;
  if (status === 'Partial') return C.purple;
  return C.amber;
}
function moneyFmt(amount, currency){
  var symbol = currency === 'USD' ? '$' : 'R';
  return symbol + Math.round(amount).toLocaleString();
}
function signedMoneyFmt(amount, currency){
  return (amount>=0 ? '+' : '-') + moneyFmt(Math.abs(amount), currency);
}

function computeLendingTotals(currency){
  var t = { outstandingPrincipal: 0, expectedReturn: 0, overdueAmount: 0, overdueCount: 0, activeCount: 0, interestEarned: interestIncomeTotal(currency), lateFeesAccrued: 0, badDebtTotal: 0, badDebtCount: 0, recoveredTotal: 0 };
  state.loans.filter(function(l){ return (l.currency||'USD') === currency; }).forEach(function(l){
    var st = loanStatus(l);
    if (st === 'Cleared') { return; }
    if (st === 'Bad Debt' || st === 'Recovered') {
      t.badDebtCount++;
      t.badDebtTotal += (l.badDebtAmount||0);
      t.recoveredTotal += loanRecoveredTotal(l);
      return;
    }
    t.activeCount++;
    t.outstandingPrincipal += Math.max(l.amountBorrowed - loanTotalPaid(l), 0);
    t.expectedReturn += loanBalanceRemaining(l);
    if (st === 'Overdue') {
      t.overdueCount++;
      t.overdueAmount += loanBalanceRemaining(l);
      t.lateFeesAccrued += loanLateFee(l);
    }
  });
  return t;
}

// Summarizes overdue loans across every currency in use, for the Overview attention banner.
function computeOverdueLoansSummary(){
  var currencies = Array.from(new Set(state.loans.map(function(l){ return l.currency||'USD'; })));
  var count = 0, parts = [];
  currencies.forEach(function(cur){
    var t = computeLendingTotals(cur);
    if (t.overdueCount) {
      count += t.overdueCount;
      parts.push(moneyFmt(t.overdueAmount, cur)+' ('+t.overdueCount+')');
    }
  });
  return { count: count, parts: parts };
}

function addDaysISO(dateStr, days){
  var d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
function addMonthsISO(dateStr, months){
  var d = new Date(dateStr + 'T00:00:00');
  d.setMonth(d.getMonth() + months);
  return d.toISOString().slice(0,10);
}

function addTank(name, location, salesperson, whatsapp){
  var entry = { id: uid(), name: name, location: location||'', salesperson: salesperson||'', whatsapp: whatsapp||'', currentLevel: TANK_CAPACITY, lastRefillDate: todayISO(), cycleSeq: 0, incomeEnabled: true, cleaningResetAtCycle: 0, waterTestResetAtCycle: 0 };

}
// Deletes a tank and every record that references it — readings, collections, and
// refills. There's no undo once saved, which is why this is always routed through the
// confirm dialog first, same as every other destructive action in the app.
function deleteTank(id){
  state.tanks = state.tanks.filter(function(t){ return t.id!==id; });
  state.readings = state.readings.filter(function(r){ return r.tankId!==id; });
  state.collections = state.collections.filter(function(c){ return c.tankId!==id; });
  state.refills = state.refills.filter(function(r){ return r.tankId!==id; });
  state.cleanings = state.cleanings.filter(function(c){ return c.tankId!==id; });
  state.waterTests = state.waterTests.filter(function(w){ return w.tankId!==id; });
  saveState();
}

// A pin for a tank that isn't yours — entered directly from the Map tab, not the
// Tanks tab, and kept in its own list so it never mixes into your own tank
// records, readings, or income stats. Used to plot other operators' tanks

function deleteOtherTank(id){
