      (ui.otherTankMsg ? '<div style="font-size:12.5px;color:'+C.crisis+';margin-bottom:10px">'+esc(ui.otherTankMsg)+'</div>' : '') +
      '<div style="display:flex;gap:8px">' +
      '<button data-action="save-other-tank" class="btn-primary" style="flex:1;background:linear-gradient(135deg,'+C.amber+' 0%,#A85E06 100%);box-shadow:0 1px 1px rgba(120,80,10,0.15),0 8px 18px -6px rgba(217,130,10,0.45)">'+icon('plus',17,'#fff')+' Add to map</button>' +
      '<button data-action="cancel-add-other-tank" style="flex:0 0 auto;padding:0 16px;border-radius:10px;border:1px solid '+C.line+';background:'+C.surface+';color:'+C.inkSoft+';font-weight:600;font-size:14px">Cancel</button>' +
      '</div>';
  } else if (isAdminUser) {
    html += '<button data-action="toggle-add-other-tank" style="display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed '+C.amber+';border-radius:14px;background:'+C.surface+';color:'+C.amber+';font-weight:600;font-size:14px;padding:12px;width:100%">'+icon('plus',17,C.amber)+' Add a tank that isn\'t mine</button>';
  }
  html += '</div>';

  if (others.length) {
    html += '<div class="card" style="margin-top:14px"><div class="serif" style="font-weight:600;font-size:15px;margin-bottom:8px">Other tanks pinned ('+others.length+')</div>';
    others.forEach(function(o){
      var hasCoords = o.lat!=null && o.lng!=null && o.lat!=='' && o.lng!=='';
      if (ui.editingOtherTankId === o.id && isAdminUser) {
        html += '<div style="padding:10px 0;border-top:1px solid '+C.line+'">' +
          '<label class="label">Name / owner / area</label><input id="eot-name-'+o.id+'" class="field" style="margin-bottom:8px" value="'+esc(o.name)+'"/>' +
          '<label class="label">Description / notes</label><textarea id="eot-notes-'+o.id+'" class="field" style="margin-bottom:10px;min-height:56px;resize:vertical">'+esc(o.notes||'')+'</textarea>' +
          '<div style="display:flex;gap:8px">' +
          '<button data-action="save-edit-other-tank" data-id="'+o.id+'" class="btn-primary" style="flex:1;background:linear-gradient(135deg,'+C.amber+' 0%,#A85E06 100%)">Save</button>' +
          '<button data-action="cancel-edit-other-tank" style="flex:0 0 auto;padding:0 16px;border-radius:10px;border:1px solid '+C.line+';background:'+C.surface+';color:'+C.inkSoft+';font-weight:600;font-size:14px">Cancel</button>' +
          '</div></div>';
      } else {
        html += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid '+C.line+'">' +
          '<div data-action="'+(hasCoords?'view-other-tank':'')+'" data-id="'+o.id+'" data-lat="'+esc(o.lat)+'" data-lng="'+esc(o.lng)+'" style="min-width:0;flex:1'+(hasCoords?';cursor:pointer':'')+'">' +
          '<div style="font-size:12.5px;font-weight:600">'+esc(o.name)+'</div>' +
          '<div class="mono" style="color:'+C.inkSoft+';font-size:11px">'+esc(o.lat)+', '+esc(o.lng)+'</div>' +
          (o.notes ? '<div style="color:'+C.inkSoft+';font-size:11px;margin-top:1px">'+esc(o.notes)+'</div>' : '') +
          '</div>' +
          (isAdminUser ? '<button data-action="edit-other-tank" data-id="'+o.id+'" style="flex-shrink:0;background:none;border:none;color:'+C.tank+';display:flex;padding:4px">'+icon('pencil',14,C.tank)+'</button>' +
          '<button data-action="delete-other-tank" data-id="'+o.id+'" style="flex-shrink:0;background:none;border:none;color:'+C.crisis+';display:flex;padding:4px">'+icon('trash',14,C.crisis)+'</button>' : '') +
          '</div>';
      }
    });
    html += '</div>';
  }

  if (!withCoords.length) {
    html += '<div class="card" style="margin-top:14px;text-align:center;color:'+C.inkSoft+';font-size:13px;padding:20px">No tanks have coordinates yet. Go to the Tanks tab, tap the pencil on a tank, and add its latitude and longitude — or use "My location" above to read off your current coordinates while you\'re standing at a tank.</div>';
  } else {
    html += '<div class="card" style="margin-top:14px"><div class="serif" style="font-weight:600;font-size:15px;margin-bottom:8px">Your tanks pinned ('+withCoords.length+' of '+state.tanks.length+')</div>';
    withCoords.forEach(function(t){
      html += '<div data-action="view-own-tank" data-id="'+t.id+'" data-lat="'+esc(t.lat)+'" data-lng="'+esc(t.lng)+'" style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12.5px;border-top:1px solid '+C.line+';cursor:pointer"><span>'+esc(t.name)+'</span><span class="mono" style="color:'+C.inkSoft+'">'+esc(t.lat)+', '+esc(t.lng)+'</span></div>';
    });
    html += '</div>';
  }
  return html;
}

function renderCurrencyStats(currency, label){
  var totals = computeLendingTotals(currency);
  if (!totals.activeCount && !totals.interestEarned && !state.loans.some(function(l){ return (l.currency||'USD')===currency; })) return '';
  var html = '<div class="serif" style="font-weight:600;font-size:14px;margin:2px 0 8px;color:'+C.inkSoft+'">'+label+'</div>' +
    '<div style="display:flex;gap:10px;margin-bottom:10px">' +
    statCard('Out on loan', moneyFmt(totals.outstandingPrincipal, currency), totals.activeCount+' active loan'+(totals.activeCount===1?'':'s'), C.tank) +
    statCard('Expected back', moneyFmt(totals.expectedReturn, currency), 'principal + interest', C.cash) +
    '</div>';
  if (totals.overdueCount > 0) {
    html += '<div class="card" style="margin-bottom:10px;border-color:'+C.crisis+';display:flex;gap:10px;align-items:flex-start">' + icon('alert',18,C.crisis) +
      '<div><div style="font-weight:600;font-size:14px">'+totals.overdueCount+' loan'+(totals.overdueCount===1?'':'s')+' overdue</div>' +
      '<div style="font-size:13px;color:'+C.inkSoft+'">Totaling '+moneyFmt(totals.overdueAmount, currency)+' still owed past the due date' +
      (totals.lateFeesAccrued > 0.5 ? ', including '+moneyFmt(totals.lateFeesAccrued, currency)+' in accrued late fees' : '') + '.</div></div></div>';
  }
  html += '<div style="margin-bottom:14px">' + statCard('Interest earned', moneyFmt(totals.interestEarned, currency), 'lifetime, all loans', C.cash) + '</div>';
  if (totals.badDebtCount > 0) {
    var netLoss = totals.badDebtTotal - totals.recoveredTotal;
    html += '<div style="margin-bottom:14px">' + statCard('Bad debt', moneyFmt(netLoss, currency), totals.badDebtCount+' written off'+(totals.recoveredTotal>0.005?', '+moneyFmt(totals.recoveredTotal,currency)+' recovered':''), netLoss>0.005?C.crisis:C.cash) + '</div>';
  }
  return html;
}

function renderLending(){
  var hasUSD = state.loans.some(function(l){ return l.currency === 'USD'; });
  var loans = state.loans.slice().sort(function(a,b){
    function rank(l){ var st = loanStatus(l); return st==='Overdue' ? 0 : st==='Partial' ? 1 : st==='Pending' ? 2 : 3; }
    var ra = rank(a), rb = rank(b);
    if (ra !== rb) return ra - rb;
    return new Date(a.dateDue) - new Date(b.dateDue);
  });

  var html = renderCurrencyStats('USD', 'US Dollar ($)');

  if (ui.addingLoan) {
    html += '<div class="card" style="margin-bottom:14px">' +
      '<div class="serif" style="font-weight:600;font-size:16px;margin-bottom:10px">New loan</div>' +
      '<label class="label">Borrower name</label><input id="ln-name" class="field" style="margin-bottom:10px" placeholder="e.g. Tendai"/>' +
      '<label class="label">Borrower WhatsApp</label><input id="ln-whatsapp" type="tel" class="field mono" style="margin-bottom:10px" placeholder="e.g. 0771234567"/>' +
      '<label class="label">Amount borrowed ($)</label><input id="ln-amount" type="number" class="field mono" style="margin-bottom:10px" placeholder="e.g. 500"/>' +
      '<label class="label">Date borrowed</label><input id="ln-borrowed-date" type="date" class="field mono" value="'+todayISO()+'" style="margin-bottom:10px"/>' +
      '<label class="label">Due date</label>' +
      '<div style="display:flex;gap:8px;margin-bottom:6px">' +
      '<input id="ln-due-date" type="date" class="field mono" style="flex:1"/>' +
      '</div>' +
      '<div style="display:flex;gap:8px;margin-bottom:10px">' +
      '<button data-action="set-due-quick" data-unit="days" data-amount="14" style="flex:1;padding:8px;border-radius:8px;border:1px solid '+C.line+';background:'+C.surface+';color:'+C.tank+';font-weight:600;font-size:12.5px">+2 weeks</button>' +
      '<button data-action="set-due-quick" data-unit="months" data-amount="1" style="flex:1;padding:8px;border-radius:8px;border:1px solid '+C.line+';background:'+C.surface+';color:'+C.tank+';font-weight:600;font-size:12.5px">+1 month</button>' +
      '</div>' +
      '<label class="label">Interest rate (%)</label><input id="ln-interest" type="number" min="0" step="1" class="field mono" value="40" style="margin-bottom:10px"/>' +
      '<label class="label">Amount to be returned ($)</label><input id="ln-amount-due" type="number" class="field mono" style="margin-bottom:6px" placeholder="auto: principal + interest"/>' +
      '<div style="font-size:11.5px;color:'+C.inkSoft+';margin-bottom:12px">Fills in automatically from the interest rate above — set it to 0 for an interest-free loan, or edit the amount directly for a custom deal.</div>' +
      '<label class="label">Late fee (%/day after due date)</label><input id="ln-latefee" type="number" min="0" step="0.1" class="field mono" value="0" style="margin-bottom:6px"/>' +
      '<div style="font-size:11.5px;color:'+C.inkSoft+';margin-bottom:12px">Optional. Charged daily on whatever balance is still outstanding once a loan goes past its due date — leave at 0 for no late fee.</div>' +
      '<label style="display:flex;align-items:flex-start;gap:8px;margin-bottom:12px;cursor:pointer">' +
      '<input id="ln-backdated" type="checkbox" style="margin-top:3px"/>' +
      '<span style="font-size:12.5px;color:'+C.inkSoft+'">Backdated entry — this money already left the account before it was tracked here. Don\'t deduct it again.</span>' +
      '</label>' +
      (ui.msg ? '<div style="font-size:12.5px;color:'+C.inkSoft+';margin-bottom:10px">'+esc(ui.msg)+'</div>' : '') +
      '<div style="display:flex;gap:8px">' +
      '<button data-action="save-loan" class="btn-primary" style="flex:1">'+icon('plus',17,'#fff')+' Add loan</button>' +
      '<button data-action="cancel-new-loan" style="flex:0 0 auto;padding:0 16px;border-radius:10px;border:1px solid '+C.line+';background:'+C.surface+';color:'+C.inkSoft+';font-weight:600;font-size:14px">Cancel</button>' +
      '</div></div>';
  } else {
    html += '<button data-action="toggle-add-loan" style="width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed '+C.tank+';border-radius:14px;background:'+C.surface+';color:'+C.tank+';font-weight:600;font-size:14px;padding:12px;margin-bottom:14px">'+icon('plus',17,C.tank)+' New loan</button>';
  }

  if (!loans.length) {
    html += '<div class="card" style="text-align:center;padding:30px">' + icon('cash',26,C.tank) +
      '<div class="serif" style="font-size:17px;font-weight:600;margin:8px 0 4px">No loans recorded yet</div>' +
      '<div style="font-size:13px;color:'+C.inkSoft+'">This is tracked separately from your water business. Add your first loan above.</div></div>';
  } else {
    html += '<div style="display:flex;flex-direction:column;gap:10px">';
    loans.forEach(function(l){
      var st = loanStatus(l);
      var color = loanStatusColor(st);
      var cur = l.currency || 'USD';
      var paid = loanTotalPaid(l);
      var lateFee = loanLateFee(l);
      var balance = loanBalanceRemaining(l);
      var daysOver = loanDaysOverdue(l);
      var payments = (l.payments||[]).slice().sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
      html += '<div class="card" style="padding:14px">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">' +
        '<div style="min-width:0">' +
        '<div style="display:flex;align-items:center;gap:6px"><div style="font-weight:600;font-size:15px">'+esc(l.name)+'</div>' +
        (cur==='USD' ? '<span style="font-size:10px;font-weight:700;color:'+C.tank+';border:1px solid '+C.tank+';border-radius:5px;padding:1px 5px">USD</span>' : '') +
        '</div>' +
        (l.whatsapp ? '<a href="'+waLink(l.whatsapp)+'" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:4px;color:#25D366;font-weight:600;font-size:11.5px;background:#25D36614;border-radius:999px;padding:2px 9px 2px 7px;margin-top:3px">'+icon('whatsapp',12,'#25D366')+' Chat on WhatsApp</a>' : '') +
        '<div style="font-size:12px;color:'+C.inkSoft+'">Borrowed '+moneyFmt(l.amountBorrowed, cur)+' on '+l.dateBorrowed+'</div>' +
        '<div style="font-size:12px;color:'+C.inkSoft+'">Due '+moneyFmt(l.amountDue, cur)+' by '+l.dateDue+' <span style="color:'+C.inkSoft+'">('+Math.round((l.amountDue/l.amountBorrowed - 1)*100)+'% interest)</span></div>' +
        (lateFee > 0.5 ? '<div style="font-size:12px;color:'+C.crisis+'">+'+moneyFmt(lateFee, cur)+' late fee ('+daysOver+' day'+(daysOver===1?'':'s')+' overdue @ '+(l.lateFeePct||0)+'%/day)</div>' : '') +
        (paid > 0 ? '<div style="font-size:12px;color:'+C.cash+'">Paid so far: '+moneyFmt(paid, cur)+'</div>' : '') +
        (!l.cleared && !l.badDebt && (paid > 0 || lateFee > 0.5) ? '<div style="font-size:12.5px;font-weight:600">Balance remaining: '+moneyFmt(balance, cur)+'</div>' : '') +
        (l.cleared && l.dateCleared ? '<div style="font-size:11.5px;color:'+C.cash+'">Cleared '+l.dateCleared+'</div>' : '') +
        (l.badDebt ? '<div style="font-size:11.5px;color:'+C.crisis+'">Written off '+esc(l.dateBadDebt)+' — '+moneyFmt(l.badDebtAmount||0, cur)+' lost</div>' : '') +
        '</div>' +
        '<span style="flex-shrink:0;padding:3px 10px;border-radius:999px;background:'+color+';color:#fff;font-size:11px;font-weight:600">'+st+'</span>' +
        '</div>';
      if (payments.length) {
        // Walk the payments chronologically, allocating each one against interest
        // (+ late fee accrued up to that point) before principal — the same order
        // reconcileLoanTithe uses — purely so each row can show its own tithe split.
        var totalOwedForFee = (l.amountDue - l.amountBorrowed) + loanLateFee(l);
        html += '<div style="margin-top:8px;padding-top:8px;border-top:1px solid '+C.line+'">';
        payments.forEach(function(p){
          var interestable = Math.max(totalOwedForFee, 0);
          var interestPortion = Math.min(p.amount, interestable);
          totalOwedForFee = Math.max(totalOwedForFee - p.amount, 0);
          var tithePortion = interestPortion * TITHE_RATE;
          html += '<div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:2px 0">' +
            '<span style="color:'+C.inkSoft+'">'+p.date+'</span>' +
            '<span class="mono" style="color:'+C.cash+';font-weight:600">'+moneyFmt(p.amount, cur)+'</span>' +
            '<button data-action="delete-loan-payment" data-loan-id="'+l.id+'" data-payment-id="'+p.id+'" style="border:none;background:none;color:'+C.inkSoft+';padding:2px 4px">'+icon('trash',12)+'</button>' +
            '</div>' +
            (tithePortion > 0.005 ? '<div style="font-size:10.5px;color:'+C.gold+';text-align:right;margin-top:-2px">tithe '+moneyFmt(tithePortion, cur)+' of '+moneyFmt(interestPortion, cur)+' interest</div>' : '');
        });
        html += '</div>';
      }
      if (l.badDebt && (l.recoveries||[]).length) {
        html += '<div style="margin-top:8px;padding-top:8px;border-top:1px solid '+C.line+'">';
        l.recoveries.forEach(function(r){
          html += '<div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:2px 0">' +
            '<span style="color:'+C.inkSoft+'">'+esc(r.date)+(r.notes?' — '+esc(r.notes):'')+'</span>' +
            '<span class="mono" style="color:'+C.cash+';font-weight:600">'+moneyFmt(r.amount, cur)+'</span></div>';
        });
        html += '</div>';
      }
      if (ui.recordingPaymentFor === l.id) {
        html += '<div style="margin-top:10px;padding-top:10px;border-top:1px solid '+C.line+'">' +
          '<label class="label">Payment amount ('+(cur==='USD'?'$':'R')+')</label>' +
          '<input id="pay-amount-'+l.id+'" type="number" class="field mono" style="margin-bottom:8px" placeholder="e.g. 100" value="'+(balance>0?Math.round(balance*100)/100:'')+'"/>' +
          '<label class="label">Date received</label>' +
          '<input id="pay-date-'+l.id+'" type="date" class="field mono" value="'+todayISO()+'" style="margin-bottom:10px"/>' +
          '<div style="display:flex;gap:8px">' +
          '<button data-action="save-loan-payment" data-id="'+l.id+'" class="btn-primary btn-cash" style="flex:1">Save payment</button>' +
          '<button data-action="cancel-loan-payment" style="flex:0 0 auto;padding:0 16px;border-radius:10px;border:1px solid '+C.line+';background:'+C.surface+';color:'+C.inkSoft+';font-weight:600;font-size:14px">Cancel</button>' +
          '</div></div>';
      } else if (ui.recordingRecoveryFor === l.id) {
        html += '<div style="margin-top:10px;padding-top:10px;border-top:1px solid '+C.line+'">' +
          '<label class="label">Amount recovered ('+(cur==='USD'?'$':'R')+')</label>' +
          '<input id="rec-amount-'+l.id+'" type="number" class="field mono" style="margin-bottom:8px" placeholder="e.g. 60"/>' +
          '<label class="label">Date received</label>' +
          '<input id="rec-date-'+l.id+'" type="date" class="field mono" value="'+todayISO()+'" style="margin-bottom:10px"/>' +
          '<label class="label">Notes (optional)</label><input id="rec-notes-'+l.id+'" class="field" style="margin-bottom:12px" placeholder="optional"/>' +
          '<div style="display:flex;gap:8px">' +
          '<button data-action="save-bad-debt-recovery" data-id="'+l.id+'" class="btn-primary btn-cash" style="flex:1">Save recovery</button>' +
          '<button data-action="cancel-bad-debt-recovery" style="flex:0 0 auto;padding:0 16px;border-radius:10px;border:1px solid '+C.line+';background:'+C.surface+';color:'+C.inkSoft+';font-weight:600;font-size:14px">Cancel</button>' +
          '</div></div>';
      } else {
        html += '<div style="display:flex;gap:8px;margin-top:10px">' +
          (!l.cleared && !l.badDebt ? '<button data-action="record-loan-payment" data-id="'+l.id+'" style="flex:1;padding:8px;border-radius:8px;border:1px solid '+C.line+';background:'+C.surface+';color:'+C.tank+';font-weight:600;font-size:12.5px">Record payment</button>' : '') +
          (!l.cleared && !l.badDebt ? '<button data-action="toggle-loan" data-id="'+l.id+'" style="flex:1;padding:8px;border-radius:8px;border:1px solid '+C.line+';background:'+C.surface+';color:'+C.cash+';font-weight:600;font-size:12.5px">'+(paid>0 ? 'Settle remaining' : 'Mark cleared')+'</button>' : '') +
          (l.cleared ? '<button data-action="toggle-loan" data-id="'+l.id+'" style="flex:1;padding:8px;border-radius:8px;border:1px solid '+C.line+';background:'+C.surface+';color:'+C.inkSoft+';font-weight:600;font-size:12.5px">Reopen</button>' : '') +
          (!l.cleared && !l.badDebt ? '<button data-action="mark-loan-bad-debt" data-id="'+l.id+'" style="flex-shrink:0;padding:8px 10px;border-radius:8px;border:1px solid '+C.crisis+';background:'+C.surface+';color:'+C.crisis+';font-weight:600;font-size:12.5px">Bad debt</button>' : '') +
          (l.badDebt && loanRecoveredTotal(l) < (l.badDebtAmount||0) - 0.005 ? '<button data-action="record-bad-debt-recovery" data-id="'+l.id+'" style="flex:1;padding:8px;border-radius:8px;border:1px solid '+C.line+';background:'+C.surface+';color:'+C.cash+';font-weight:600;font-size:12.5px">Record recovery</button>' : '') +
          '<button data-action="delete-loan" data-id="'+l.id+'" style="flex-shrink:0;padding:8px 12px;border-radius:8px;border:1px solid '+C.line+';background:'+C.surface+';color:'+C.inkSoft+'">'+icon('trash',14)+'</button>' +
          '</div>';
      }
      html += '</div>';
    });
    html += '</div>';
  }

  return html;
}

// ---------- business account rendering ----------

function collapseCardHeader(action, key, open, title){
  return '<button data-action="'+action+'" data-key="'+esc(key)+'" class="collapse-card-btn">' +
    '<span class="serif" style="font-weight:650;font-size:15px">'+esc(title)+'</span>' +
    '<span class="drawer-chevron'+(open?' open':'')+'">'+icon('chevron',16,C.inkSoft)+'</span>' +
    '</button>';
}

function renderAccountDashboard(currency, label){
  var open = !!ui.acctDashExpanded[currency];
  var heading = 'USD Dashboard';
  var html = '<div class="card collapse-card">' + collapseCardHeader('toggle-acct-dash', currency, open, heading);
  if (!open) { html += '</div>'; return html; }

  var t = computeAccountTotals(currency);
  html += '<div class="collapse-card-body" style="margin-top:12px">';
  html += '<div style="margin-bottom:14px">' + statCard('Running capital', moneyFmt(t.runningCapital, currency), 'account balance + cash in hand + money lent out', C.tank) + '</div>';
  html += '<div style="display:flex;gap:10px;margin-bottom:10px">' +
    statCard('Account balance', moneyFmt(t.balance, currency), 'current available balance', t.balance>=0?C.cash:C.crisis) +
    statCard('Cash in hand', moneyFmt(t.cashInHand, currency), 'physical cash, transferred out', C.gold) +
    '</div>';
  html += '<div style="display:flex;gap:10px;margin-bottom:10px">' +

// Compares staff/labor spend against income on a monthly-average basis, so a
// recurring wage (like a meter reader) can be judged against what it actually costs
// per month vs. what the business brings in per month — not just a lump lifetime total.
function renderStaffCostImpact(currency){
  var p = computeProfitLoss(currency);
  if (p.staffExpense <= 0.005) return '';
  var tx = state.accountTx.filter(function(t){ return (t.currency||'USD')===currency; });
  if (!tx.length) return '';
  var dates = tx.map(function(t){ return new Date(t.date).getTime(); });
  var minD = Math.min.apply(null, dates), maxD = Math.max.apply(null, dates);
  var months = Math.max((maxD - minD) / (1000*60*60*24*30.44), 1/30.44);
  var monthlyIncome = p.totalIncome / months;
  var monthlyStaff = p.staffExpense / months;
  var monthlyOtherOpEx = p.runningCosts / months;
  var monthlyOpProfit = monthlyIncome - monthlyOtherOpEx - monthlyStaff;
  var pctOfIncome = monthlyIncome > 0.005 ? (monthlyStaff / monthlyIncome * 100) : null;
  var key = 'staffimpact-'+currency;
  var open = !!ui.acctSectionOpen[key];
  var html = '<div class="card collapse-card">' + collapseCardHeader('toggle-acct-section', key, open, 'Staff Cost Impact');
  if (!open) { html += '</div>'; return html; }
  html += '<div class="collapse-card-body" style="margin-top:10px">';
  html += '<div style="font-size:12px;color:'+C.inkSoft+';margin-bottom:12px">Staff/labor spending measured against income, averaged per month over the period recorded — so you can see whether the cost is being covered by what the business brings in.</div>';
  function line(name, value, color){
    return '<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:13px;color:'+(color||C.inkSoft)+'"><span>'+esc(name)+'</span><span class="mono">'+moneyFmt(value, currency)+'</span></div>';
  }
  html += line('Avg. monthly income', monthlyIncome) +
    line('Avg. monthly staff/labor cost', monthlyStaff, C.crisis) +
    (pctOfIncome !== null ? '<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:13px;color:'+C.inkSoft+'"><span>Staff cost as % of income</span><span class="mono">'+pctOfIncome.toFixed(1)+'%</span></div>' : '') +
    '<div style="display:flex;justify-content:space-between;gap:8px;padding-top:10px;margin-top:6px;border-top:1px solid '+C.line+';font-weight:700;font-size:14px;color:'+(monthlyOpProfit>=0?C.cash:C.crisis)+'"><span>Est. monthly operating profit</span><span class="mono">'+moneyFmt(monthlyOpProfit, currency)+'</span></div>' +
    '<div style="font-size:11px;color:'+C.inkSoft+';margin-top:8px">If this stays negative or shrinks over time, the staff cost isn\'t being covered by extra income or capacity yet — worth reviewing after a couple of months of data.</div>' +
    '</div></div>';
  return html;
}

  ui.addingLoan=false; ui.recordingPaymentFor=null; ui.logPresetCycle=null; ui.msg=''; ui.lockError='';

// ---------- event delegation ----------
// Actions a salesperson (any non-admin login) can never trigger, regardless of
// whether a button for them happens to be on screen — the UI already hides these,
// this is just the backstop. Income, Lending and Account stay off-limits at the
// tab level (see render()); this covers the record-level edit/delete controls on
// the Tanks tab, the two restricted Log functions, and the Payments shortcut into
// the Collect log.
var ADMIN_ONLY_ACTIONS = {
  'edit-tank': 1, 'delete-tank': 1, 'toggle-income-enabled': 1, 'toggle-add-tank': 1, 'save-new-tank': 1,
  'edit-reading': 1, 'delete-reading': 1, 'save-edit-reading': 1,
  'edit-collection': 1, 'delete-collection': 1, 'save-edit-collection': 1,
  'edit-refill': 1, 'delete-refill': 1, 'save-edit-refill': 1,
  'delete-cleaning': 1, 'delete-watertest': 1,
  'goto-collect': 1, 'save-collection': 1, 'save-refill': 1,
  'export-excel': 1,
  'toggle-add-other-tank': 1, 'save-other-tank': 1, 'edit-other-tank': 1, 'delete-other-tank': 1,
  'save-edit-other-tank': 1, 'use-my-location-other': 1,
  'open-set-pin': 1, 'open-remove-pin': 1, 'download-backup': 1, 'trigger-restore': 1
};
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if (!el) return;
  var action = el.getAttribute('data-action');
  var isSalesperson = currentUser && currentUser.role !== 'admin';
  if (isSalesperson && ADMIN_ONLY_ACTIONS[action]) return;
  if (isSalesperson && action === 'log-mode') {
    var reqMode = el.getAttribute('data-mode');
    if (reqMode === 'collect' || reqMode === 'refill') return;
  }

  if (action === 'set-tab') { ui.drawerOpen = false; switchTab(el.getAttribute('data-tab')); }
  else if (action === 'sign-out') { auth.signOut(); }
  else if (action === 'toggle-drawer') { ui.drawerOpen = !ui.drawerOpen; render(); }
  else if (action === 'close-drawer') { ui.drawerOpen = false; render(); }
  else if (action === 'toggle-drawer-section') {
    var secKey = el.getAttribute('data-section');
    ui.drawerSection = (ui.drawerSection === secKey) ? null : secKey;
    render();
  }
  else if (action === 'goto-tanks') { ui.tab='tanks'; render(); }
  else if (action === 'goto-log-reading') { ui.tab='log'; ui.logMode='reading'; ui.logTankId=el.getAttribute('data-tank'); ui.msg=''; render(); }
  else if (action === 'goto-log-clean') { ui.tab='log'; ui.logMode='clean'; ui.logTankId=el.getAttribute('data-tank'); ui.msg=''; render(); }
  else if (action === 'goto-log-test') { ui.tab='log'; ui.logMode='test'; ui.logTankId=el.getAttribute('data-tank'); ui.msg=''; render(); }
  else if (action === 'delete-cleaning') { ui.confirmDialog = { type: 'delete-cleaning', id: el.getAttribute('data-id'), message: 'Delete this cleaning record? This can\'t be undone.' }; render(); }
  else if (action === 'delete-watertest') { ui.confirmDialog = { type: 'delete-watertest', id: el.getAttribute('data-id'), message: 'Delete this water test record? This can\'t be undone.' }; render(); }
  else if (action === 'goto-collect') {
    ui.tab = 'log'; ui.logMode = 'collect';
    ui.logTankId = el.getAttribute('data-tank');
    ui.logPresetCycle = el.getAttribute('data-cycle');
    ui.msg = '';
    render();
  }
  else if (action === 'log-mode') { ui.logMode = el.getAttribute('data-mode'); ui.logPresetCycle=null; ui.msg=''; render(); }
  else if (action === 'edit-tank') { ui.editingTankId = el.getAttribute('data-tank'); render(); }
  else if (action === 'done-edit') { ui.editingTankId = null; render(); }
  else if (action === 'delete-reading') { ui.confirmDialog = { type: 'delete-reading', id: el.getAttribute('data-id'), message: 'Delete this level reading? This can\'t be undone.' }; render(); }
  else if (action === 'delete-collection') { ui.confirmDialog = { type: 'delete-collection', id: el.getAttribute('data-id'), message: 'Delete this collection record? This can\'t be undone.' }; render(); }
  else if (action === 'toggle-income-enabled') {
    var tiId = el.getAttribute('data-tank');
    var tiTank = state.tanks.filter(function(x){ return x.id===tiId; })[0];
    editTank(tiId, { incomeEnabled: !isIncomeTank(tiTank) });
    render();
  }
  else if (action === 'delete-tank') {
    var dtId = el.getAttribute('data-tank');
    var dtTank = state.tanks.filter(function(x){ return x.id===dtId; })[0];
    var dtName = dtTank ? dtTank.name : 'this tank';
    ui.confirmDialog = { type: 'delete-tank', id: dtId, message: 'Delete "'+dtName+'"? This permanently erases the tank and every reading, collection, refill, cleaning, and water test recorded against it. This can\'t be undone.' };
    render();
  }
  else if (action === 'delete-refill') { ui.confirmDialog = { type: 'delete-refill', id: el.getAttribute('data-id'), message: 'Delete this refill record? This can\'t be undone.' }; render(); }
  else if (action === 'edit-reading') { ui.editingReadingId = el.getAttribute('data-id'); ui.editingCollectionId = null; ui.editingRefillId = null; render(); }
  else if (action === 'cancel-edit-reading') { ui.editingReadingId = null; render(); }
  else if (action === 'save-edit-reading') {
    var erId = el.getAttribute('data-id');
    var erDate = document.getElementById('er-date-'+erId).value;
    var erLevel = parseInt(document.getElementById('er-level-'+erId).value, 10);
    if (!erDate || isNaN(erLevel) || erLevel<0 || erLevel>TANK_CAPACITY) { ui.msg = 'Enter a level between 0 and '+TANK_CAPACITY+' litres.'; render(); return; }
    editReading(erId, erDate, erLevel);
    ui.editingReadingId = null;
    render();
  }
  else if (action === 'edit-collection') { ui.editingCollectionId = el.getAttribute('data-id'); ui.editingReadingId = null; ui.editingRefillId = null; render(); }
  else if (action === 'toggle-collections-expand') { var ctId = el.getAttribute('data-tank'); ui.collectionsExpanded[ctId] = !ui.collectionsExpanded[ctId]; render(); }
  else if (action === 'toggle-refills-expand') { var rtId = el.getAttribute('data-tank'); ui.refillsExpanded[rtId] = !ui.refillsExpanded[rtId]; render(); }
  else if (action === 'toggle-acct-dash') { var adKey = el.getAttribute('data-key'); ui.acctDashExpanded[adKey] = !ui.acctDashExpanded[adKey]; render(); }
  else if (action === 'toggle-acct-hist-card') { var ahcKey = el.getAttribute('data-key'); ui.acctHistCardExpanded[ahcKey] = !ui.acctHistCardExpanded[ahcKey]; render(); }

    var date2 = document.getElementById('f-date').value || todayISO();
    var ls = parseFloat(document.getElementById('f-litres').value);
    var sp = parseFloat(document.getElementById('f-salespay').value) || 0;
    var rs = parseFloat(document.getElementById('f-restock').value) || 0;
    if (!tankId2 || isNaN(ls) || ls<=0) { ui.msg = 'Enter litres sold for this cycle.'; render(); return; }
    ui.logTankId = tankId2;
    addRefill(tankId2, date2, ls, sp, rs);
    ui.msg = 'Tank refilled — reset to full.';
    render();
  }
  else if (action === 'save-cleaning') {
    var tankIdCl = document.getElementById('f-tank').value;
    var dateCl = document.getElementById('f-date').value || todayISO();
    var person = document.getElementById('f-clean-person').value.trim();
    var method = document.getElementById('f-clean-method').value.trim();
    var disinfectant = document.getElementById('f-clean-disinfectant').value.trim();
    var remarksCl = document.getElementById('f-clean-remarks').value.trim();
    if (!tankIdCl || !person) { ui.msg = 'Enter who cleaned the tank.'; render(); return; }
    ui.logTankId = tankIdCl;
    addCleaning(tankIdCl, dateCl, person, method, disinfectant, remarksCl);
    ui.msg = 'Cleaning recorded — cleaning cycle counter reset to 0.';
    render();
  }
  else if (action === 'save-watertest') {
    var tankIdWt = document.getElementById('f-tank').value;
    var dateWt = document.getElementById('f-date').value || todayISO();
    var sampleId = document.getElementById('f-test-sampleid').value.trim();
    var lab = document.getElementById('f-test-lab').value.trim();
    var result = document.getElementById('f-test-result').value;
    var ecoli = document.getElementById('f-test-ecoli').value.trim();
    var coliforms = document.getElementById('f-test-coliforms').value.trim();
    var remarksWt = document.getElementById('f-test-remarks').value.trim();
    if (!tankIdWt || !lab) { ui.msg = 'Enter the laboratory for this sample.'; render(); return; }
    ui.logTankId = tankIdWt;
    addWaterTest(tankIdWt, dateWt, sampleId, lab, result, ecoli, coliforms, remarksWt);
    ui.msg = 'Lab result recorded — water quality cycle counter reset to 0.';
    render();
  }
});

document.addEventListener('input', function(e){
  if (e.target.id === 'ln-amount' || e.target.id === 'ln-interest') {
    var borrowed = parseFloat(document.getElementById('ln-amount').value) || 0;
    var interestEl = document.getElementById('ln-interest');
    var interestPct = interestEl ? (parseFloat(interestEl.value) || 0) : (DEFAULT_INTEREST * 100);
    var dueField = document.getElementById('ln-amount-due');
    if (dueField) dueField.value = borrowed ? (borrowed * (1 + interestPct / 100)).toFixed(2) : '';
  }
});

document.addEventListener('change', function(e){
  if (e.target.id === 'f-tank') {
    ui.logTankId = e.target.value;
    if (ui.logMode === 'collect') render();
  }
  if (e.target.id === 'restore-input' && e.target.files && e.target.files[0]) {
    restoreFromFile(e.target.files[0]);
    e.target.value = '';
  }
});

document.addEventListener('blur', function(e){
  var field = e.target.getAttribute && e.target.getAttribute('data-edit-field');
  if (field) {
    var tankId = e.target.getAttribute('data-tank');
    var patch = {}; patch[field] = e.target.value;
    editTank(tankId, patch);
  }
}, true);

// ---------- swipe navigation ----------
// Lets the tab bar be driven by a horizontal swipe anywhere in the main content, not just
// taps on the bottom nav. Deliberately backs off in a few places: mid-swipe on the map tab
// (Leaflet needs the drag for panning), inside any horizontally-scrollable strip (the bar
// charts and wide tables use overflow-x:auto), and while a confirm/PIN modal is open.
(function(){
  var startX = 0, startY = 0, startTime = 0, tracking = false, committed = false;
  var SWIPE_DISTANCE = 55, MAX_OFF_AXIS = 65, MAX_DURATION = 900;

  function isInsideHScroll(el){
    while (el && el !== document.body) {
      if (el.scrollWidth > el.clientWidth + 2) {
        var overflowX = getComputedStyle(el).overflowX;
        if (overflowX === 'auto' || overflowX === 'scroll') return true;
      }
      el = el.parentElement;
    }
    return false;
  }

  document.addEventListener('touchstart', function(e){
    if (ui.tab === 'map' || ui.confirmDialog || ui.pinPrompt) { tracking = false; return; }
    if (e.touches.length !== 1) { tracking = false; return; }
    var t = e.touches[0];
    if (isInsideHScroll(e.target)) { tracking = false; return; }
    startX = t.clientX; startY = t.clientY; startTime = Date.now();
    tracking = true; committed = false;
  }, { passive: true });

  document.addEventListener('touchmove', function(e){
    if (!tracking || e.touches.length !== 1) return;
    var t = e.touches[0];
    var dx = t.clientX - startX, dy = t.clientY - startY;
    if (!committed) {
      if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        committed = true;
      } else if (Math.abs(dy) > 12) {
        tracking = false; return; // vertical scroll — let it through
      }
    }
    if (committed) e.preventDefault(); // own the gesture once it's clearly horizontal
  }, { passive: false });

  document.addEventListener('touchend', function(e){
    if (!tracking) return;
    tracking = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - startX, dy = t.clientY - startY;
    var dt = Date.now() - startTime;
    if (dt > MAX_DURATION || Math.abs(dy) > MAX_OFF_AXIS || Math.abs(dx) < SWIPE_DISTANCE) return;
    var idx = TAB_ORDER.indexOf(ui.tab);
    if (idx === -1) return;
    if (dx < 0 && idx < TAB_ORDER.length - 1) switchTab(TAB_ORDER[idx + 1]); // swipe left -> next tab
    else if (dx > 0 && idx > 0) switchTab(TAB_ORDER[idx - 1]); // swipe right -> previous tab
  }, { passive: true });
})();

// ---------- boot ----------
// Booting now happens in startAppForUser(), triggered by auth.onAuthStateChanged()
// above once someone signs in — nothing to do here until that fires.
</script>
